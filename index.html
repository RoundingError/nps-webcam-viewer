<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0e13" />
  <title>NPS Cams</title>
  <style>
    :root {
      --bg: #0b0e13;
      --panel: #12161d;
      --panel-2: #171c25;
      --border: #232a35;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #4b98ff;
      --danger: #f85149;
      --live: #3fb950;
      --warn: #d29922;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    /* ---------- Modern scrollbars ---------- */
    * {
      scrollbar-width: thin;
      scrollbar-color: #2d3542 transparent;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d3542;
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3d4757;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    html, body { height: 100%; }
    /* Solid dark canvas so orientation changes / overscroll never flash white. */
    html { background: var(--bg); }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #141a24 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,14,19,.72);
    }
    .brand { display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
    .brand .eyebrow {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
    }
    .brand h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .brand h1 a { color: inherit; text-decoration: none; }
    .brand h1 a[href]:hover { color: var(--accent-hover); text-decoration: underline; }
    .brand h1 a[href]::after { content: " \2197"; font-size: .7em; color: var(--muted); font-weight: 600; }
    .topbar .spacer { flex: 1; }

    .backBtn {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .backBtn:hover { background: #1e2530; border-color: #313a48; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
    }
    .pill input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .pill select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      cursor: pointer;
      font-weight: 600;
    }
    .pill select option { background: var(--panel-2); color: var(--text); }
    .pill.search { flex: 1 1 200px; min-width: 150px; }
    .pill.search input { width: auto; flex: 1; text-align: left; }
    .pill.search svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; flex: none; }
    .pill.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
    .chip {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: background .15s, border-color .15s, color .15s;
    }
    .chip:hover { border-color: #313a48; }
    .chip.on { background: rgba(47,129,247,.15); border-color: var(--accent); color: var(--accent-hover); }
    a.iconBtn { text-decoration: none; }
    .empty { padding: 48px 24px; color: var(--muted); font-size: 14px; text-align: center; }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(63,185,80,.15);
    }

    /* ---------- Views ---------- */
    .view { flex: 1; padding: 24px; }
    .view[hidden] { display: none; }

    /* ---------- Grid (preview) ---------- */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .area-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 650;
      margin: 0 2px 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .area-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #33507e;
      box-shadow: var(--shadow);
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .badge {
      position: absolute;
      top: 10px; left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      padding: 5px 9px;
      border-radius: 999px;
      color: #fff;
    }
    .badge .dot { width: 7px; height: 7px; }
    .badge.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(210,153,34,.18); }
    .badge.bad  .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(248,81,73,.18); }
    .badge.warn .badge-label { color: #f2cc60; }
    .badge.bad  .badge-label { color: #ff9d95; }
    .badge.stream .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(47,129,247,.22); }
    .badge.stream .badge-label { color: #9ec5ff; }
    .thumb .noposter { position: absolute; inset: 0; background: linear-gradient(135deg,#1b2431,#0d1117); }
    #stageStream { width: 100%; height: 100%; border: 0; }
    .thumb .playbtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .thumb .playbtn::after { content: ''; border-style: solid; border-width: 10px 0 10px 17px; border-color: transparent transparent transparent #fff; margin-left: 3px; }

    /* ---------- Favorite star (on thumbnails) ---------- */
    .star {
      position: absolute;
      top: 8px; right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
      color: rgba(255,255,255,.75);
      transition: background .15s, color .15s, transform .12s;
      padding: 0;
    }
    .star svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .star:hover { background: rgba(0,0,0,.7); transform: scale(1.08); }
    .star.on { color: #f5c518; }
    .star.on svg { fill: #f5c518; stroke: #f5c518; }

    .mini-star {
      display: inline-flex;
      color: #f5c518;
    }
    .mini-star svg { width: 13px; height: 13px; fill: #f5c518; stroke: #f5c518; }

    .favBtn.on {
      color: #f5c518;
      border-color: rgba(245,197,24,.5);
    }

    .card .meta {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card .meta .name { font-size: 14px; font-weight: 600; }
    .card .meta .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---------- Detail ---------- */
    .detail {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 20px;
      height: calc(100vh - 73px - 48px);
    }
    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stage-img {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .stage-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .stage-img img[hidden] { display: none; }

    .stage-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    .stage-bar .title { font-size: 15px; font-weight: 650; }
    .stage-bar .area-tag {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .stage-bar .spacer { flex: 1; }
    .stage-bar .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .iconBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .iconBtn:hover { background: #1e2530; border-color: #313a48; }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 4px 2px;
      font-weight: 600;
    }
    .side-cam {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .side-cam:hover { transform: translateY(-2px); border-color: #33507e; }
    .side-cam.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .side-cam .stub {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .side-cam .stub img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .side-cam .label {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .side-cam .label .dot { width: 6px; height: 6px; }

    .imgError {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      font-size: 12px;
      background: repeating-linear-gradient(45deg, #14181f, #14181f 10px, #171c25 10px, #171c25 20px);
    }
    .imgError[hidden] { display: none; }

    @media (max-width: 820px) {
      .detail { grid-template-columns: 1fr; height: auto; }
      .sidebar { flex-direction: row; overflow-x: auto; }
      .sidebar h2 { display: none; }
      .side-cam { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button class="backBtn" id="backBtn">&larr; All cameras</button>
      <div class="brand">
        <span class="eyebrow">National Park Webcams</span>
        <h1 id="brandTitle"><a id="brandSub" target="_blank" rel="noopener">Live views</a></h1>
      </div>
      <label class="pill search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="searchInput" type="search" placeholder="Search all cameras…" autocomplete="off" />
      </label>
      <button class="chip" id="chipOffline" title="Hide cameras NPS lists as inactive">Hide offline</button>
      <button class="chip" id="chipStreams" title="Show only live video streams">Streams</button>
      <span class="pill">
        Park
        <select id="parkSelect"></select>
      </span>
      <span class="pill">
        <span class="dot"></span>
        Refresh
        <select id="interval">
          <option value="1">1s</option>
          <option value="2">2s</option>
          <option value="5">5s</option>
          <option value="10">10s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
          <option value="40">40s</option>
          <option value="50">50s</option>
          <option value="60" selected>60s</option>
        </select>
      </span>
    </div>

    <!-- Grid preview -->
    <section class="view" id="gridView">
      <div class="grid" id="grid"></div>
    </section>

    <!-- Detail -->
    <section class="view" id="detailView" hidden>
      <div class="detail">
        <div class="stage">
          <div class="stage-img">
            <span class="badge" id="stageBadge"><span class="dot"></span> <span class="badge-label">Online</span></span>
            <img id="stageImage" alt="" />
            <iframe id="stageStream" hidden allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
          </div>
          <div class="stage-bar">
            <span class="title" id="stageTitle"></span>
            <span class="area-tag" id="stageArea"></span>
            <button class="iconBtn favBtn" id="stageFav">☆ Favorite</button>
            <div class="spacer"></div>
            <span class="count" id="stageUpdated" hidden></span>
            <span class="count" id="stageCount">next in 60s</span>
            <a class="iconBtn" id="stageWatch" target="_blank" rel="noopener" hidden>Watch ↗</a>
            <a class="iconBtn" id="stageLive" target="_blank" rel="noopener" hidden>Watch live ↗</a>
            <button class="iconBtn" id="stageShare">Share</button>
            <button class="iconBtn" id="stageRefresh">Refresh</button>
            <button class="iconBtn" id="stageSave">Save image</button>
          </div>
        </div>
        <div class="sidebar">
          <h2>Other cameras</h2>
          <div id="sideList"></div>
        </div>
      </div>
    </section>
  </div>

          park: 'Carlsbad Caverns',
          areas: [
            {
              area: 'Cameras',
              cameras: [
                { id: 'cave-bat', name: 'Natural Entrance (Bat Cam)', type: 'stream', embed: 'https://www.youtube.com/embed/BwiIsjXt3KI' },
              ],
            },
          ],
        },
        {
          park: 'Channel Islands',
          areas: [
            {
              area: 'Live Streams',
              cameras: [
                { id: 'chis-live', name: 'Channel Islands Live Broadcasts', type: 'stream', embed: 'https://www.youtube.com/embed/fduuCS3xToE' },
                { id: 'chis-ocean', name: 'Ocean Webcam', type: 'stream', embed: 'https://www.youtube.com/embed/OAJF1Ie1m_Q' },
                { id: 'chis-anacapa', name: 'Anacapa Island Webcam', type: 'stream', embed: 'https://www.youtube.com/embed/aaUERtNMn7o' },
                { id: 'chis-sanmiguel', name: 'San Miguel Island Ranger Station', type: 'stream', embed: 'https://www.youtube.com/embed/OtbWimuJQ_A' },
                { id: 'chis-peregrine', name: 'Peregrine Falcon Webcam', type: 'stream', embed: 'https://www.youtube.com/embed/YmZv8Pfwum4' },
                { id: 'chis-eagle-sauces', name: 'Bald Eagle — Sauces Canyon Nest', type: 'stream', embed: 'https://www.youtube.com/embed/rnTsOesC6hE' },
                { id: 'chis-eagle-fraser', name: 'Bald Eagle — Fraser Point Nest', type: 'stream', embed: 'https://www.youtube.com/embed/OY4V_AppZ6s' },
              ],
            },
          ],
        },
      ];

      // Current park + derived views.
      let parkIndex = 0;
      let AREAS = PARKS[parkIndex].areas;

      // Global lookups span every park so favorites & IDs resolve anywhere.
      const ALL_CAMERAS = PARKS.flatMap(p => p.areas.flatMap(a => a.cameras));
      const CAMERAS = ALL_CAMERAS; // refreshAll iterates current-park cams (see below)
      function camById(id) { return ALL_CAMERAS.find(c => c.id === id); }

      // NPS park codes → link the header title to each park's page on nps.gov.
      const PARK_CODES = {
        'Mount Rainier': 'mora', 'Yellowstone': 'yell', 'Grand Teton': 'grte',
        'Glacier': 'glac', 'Olympic': 'olym', 'Denali': 'dena',
        'Rocky Mountain': 'romo', 'Crater Lake': 'crla', 'Grand Canyon': 'grca',
        'Great Smoky Mountains': 'grsm', 'Hawaiʻi Volcanoes': 'havo',
        'Yosemite': 'yose', 'Acadia': 'acad', 'Zion': 'zion', 'Arches': 'arch',
        'Big Bend': 'bibe', 'Black Canyon of the Gunnison': 'blca',
        'Bryce Canyon': 'brca', 'Death Valley': 'deva', 'Glacier Bay': 'glba',
        'Great Sand Dunes': 'grsa', 'Guadalupe Mountains': 'gumo',
        'Haleakāla': 'hale', 'Isle Royale': 'isro', 'Joshua Tree': 'jotr',
        'Lassen Volcanic': 'lavo', 'Mammoth Cave': 'maca', 'Mesa Verde': 'meve',
        'New River Gorge': 'neri', 'Sequoia & Kings Canyon': 'seki',
        'Shenandoah': 'shen', 'Wrangell-St. Elias': 'wrst', 'Katmai': 'katm',
        'Carlsbad Caverns': 'cave', 'Channel Islands': 'chis',
      };

      function areaOf(id) {
        for (const p of PARKS) {
          const a = p.areas.find(a => a.cameras.some(c => c.id === id));
          if (a) return a.area;
        }
        return '';
      }
      function currentCameras() { return AREAS.flatMap(a => a.cameras); }
      function parkIndexOf(id) {
        return PARKS.findIndex(p => p.areas.some(a => a.cameras.some(c => c.id === id)));
      }
      function parkNameOf(id) { const i = parkIndexOf(id); return i === -1 ? '' : PARKS[i].park; }

      // ---------- Favorites (persisted in localStorage) ----------
      const FAV_KEY = 'nps-webcam-favorites';
      let favorites = [];
      try {
        const raw = localStorage.getItem(FAV_KEY);
        if (raw) favorites = JSON.parse(raw).filter(id => camById(id));
      } catch (e) { favorites = []; }

      function isFav(id) { return favorites.indexOf(id) !== -1; }
      function saveFavs() {
        try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (e) {}
      }
      function toggleFav(id) {
        const i = favorites.indexOf(id);
        if (i === -1) favorites.push(id); else favorites.splice(i, 1);
        saveFavs();
      }
      // Favorites are global across all parks.
      function favCameras() {
        return favorites.map(camById).filter(Boolean);
      }

      const grid = document.getElementById('grid');
      const gridView = document.getElementById('gridView');
      const detailView = document.getElementById('detailView');
      const backBtn = document.getElementById('backBtn');
      const intervalInput = document.getElementById('interval');
      const parkSelect = document.getElementById('parkSelect');
      const brandSub = document.getElementById('brandSub');

      const stageImage = document.getElementById('stageImage');
      let stageStream = document.getElementById('stageStream');
      // Swapping in a fresh iframe (vs. reassigning .src) keeps the embedded
      // player's internal navigations out of the browser's joint session
      // history — otherwise Back would unwind the iframe before the app,
      // forcing a second "← All cameras" click on stream pages.
      function replaceStageStream() {
        const fresh = document.createElement('iframe');
        fresh.id = 'stageStream';
        fresh.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
        fresh.setAttribute('allowfullscreen', '');
        fresh.hidden = true;
        stageStream.replaceWith(fresh);
        stageStream = fresh;
        return fresh;
      }
      const stageBadge = document.getElementById('stageBadge');
      const stageTitle = document.getElementById('stageTitle');
      const stageArea = document.getElementById('stageArea');
      const stageCount = document.getElementById('stageCount');
      const stageUpdated = document.getElementById('stageUpdated');
      const stageRefresh = document.getElementById('stageRefresh');
      const stageSave = document.getElementById('stageSave');
      const stageShare = document.getElementById('stageShare');
      const stageWatch = document.getElementById('stageWatch');
      const stageLive = document.getElementById('stageLive');
      const stageFav = document.getElementById('stageFav');
      const sideList = document.getElementById('sideList');
      const searchInput = document.getElementById('searchInput');
      const chipOffline = document.getElementById('chipOffline');
      const chipStreams = document.getElementById('chipStreams');

      let activeId = null;   // null = grid view
      let remaining = 0;

      // ---------- Search & filters ----------
      let searchText = '';
      let hideOffline = false;
      let streamsOnly = false;
      function passesFilters(cam) {
        if (hideOffline && cam.off) return false;
        if (streamsOnly && cam.type !== 'stream') return false;
        if (searchText && !((cam.name + ' ' + parkNameOf(cam.id)).toLowerCase().includes(searchText))) return false;
        return true;
      }

      // ---------- Session + shareable URL state ----------
      const STATE_KEY = 'nps-webcam-state';
      function parkSlug(name) {
        return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function parkIndexBySlug(slug) { return PARKS.findIndex(p => parkSlug(p.park) === slug); }
      function saveSession() {
        try { localStorage.setItem(STATE_KEY, JSON.stringify({ park: parkSlug(PARKS[parkIndex].park), interval: intervalInput.value })); } catch (e) {}
      }
      // Browser history: pushState on navigation so Back/Forward work; replace
      // (or skip) when re-applying an existing entry to avoid loops.
      let suppressHistory = false;
      function updateHash() {
        const base = parkSlug(PARKS[parkIndex].park);
        const h = '#' + (activeId ? base + '/' + activeId : base);
        if (location.hash === h) return;
        const depth = (history.state && history.state.d) || 0;
        if (suppressHistory) history.replaceState({ d: depth }, '', h);
        else history.pushState({ d: depth + 1 }, '', h);
      }
      function showParkGrid(i) {
        if (i !== -1 && i !== parkIndex) {
          parkIndex = i; AREAS = PARKS[i].areas;
          parkSelect.value = String(i); brandSub.textContent = PARKS[i].park;
        }
        openGrid();
      }
      // Show the view described by the current URL hash (used on Back/Forward).
      function applyHashState() {
        const hash = location.hash.slice(1);
        if (hash) {
          const parts = hash.split('/');
          if (parts[1] && camById(parts[1])) {
            const cam = camById(parts[1]);
            if (cam.type === 'stream' && !canEmbedInline(cam)) showParkGrid(parkIndexOf(parts[1]));
            else openDetail(parts[1]);
            return;
          }
          const i = parkIndexBySlug(parts[0]);
          if (i !== -1) { showParkGrid(i); return; }
        }
        openGrid();
      }
      window.addEventListener('popstate', () => {
        suppressHistory = true;
        if (searchText) { searchText = ''; searchInput.value = ''; }
        applyHashState();
        suppressHistory = false;
      });

      function bust(url) { return url.split('?')[0] + '?' + Date.now(); }

      // Live-video streams (YouTube/angelcam/HDOnTap): the grid shows a lightweight
      // poster; clicking embeds the live player inline in the detail view. YouTube
      // live embeds need a real (non-file) origin, so from file:// they open on
      // YouTube instead of showing an inline "Error 153".
      function ytId(u) { const m = (u || '').match(/embed\/([\w-]+)/); return m ? m[1] : null; }
      function streamPoster(cam) { const id = ytId(cam.embed); return id ? 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg' : null; }
      function streamWatch(cam) { const id = ytId(cam.embed); return id ? 'https://www.youtube.com/watch?v=' + id : cam.embed; }
      // Embed URL for inline playback in the stage (autoplay muted where supported).
      function streamEmbedSrc(cam) {
        const u = cam.embed || '';
        let s = u + (u.includes('?') ? '&' : '?') + 'autoplay=1&mute=1';
        if (ytId(cam.embed) && location.protocol !== 'file:') s += '&origin=' + encodeURIComponent(location.origin);
        return s;
      }
      // YouTube live embeds only work from a real http(s) origin.
      function canEmbedInline(cam) { return !ytId(cam.embed) || location.protocol !== 'file:'; }

      function intervalSeconds() {
        let s = parseInt(intervalInput.value, 10);
        if (isNaN(s) || s < 1) s = 1;
        return s;
      }

      // Track live <img> elements per camera plus their status callbacks so we
      // can swap in new frames and toggle the "Unavailable" overlay.
      const imgRefs = {};      // id -> [{ el, onOk, onFail }, ...]
      const retryState = {};   // id -> { tries, timer }
      const lastGoodSrc = {};  // id -> most recently loaded frame URL (for instant swaps)

      function registerImg(id, imgEl, onOk, onFail, badgeEl, timeEl) {
        const ref = { el: imgEl, onOk: onOk, onFail: onFail, badge: badgeEl || null, time: timeEl || null, visible: !imgObserver };
        (imgRefs[id] = imgRefs[id] || []).push(ref);
        // Show the cached frame immediately so swaps feel instant.
        if (lastGoodSrc[id]) {
          imgEl.src = lastGoodSrc[id];
          if (onOk) onOk();
        }
        // Lazy-load: only fetch frames for tiles near the viewport. The observer
        // flips `visible` and kicks off the first load when a tile scrolls in.
        if (imgObserver) { imgEl.__camId = id; imgEl.__ref = ref; imgObserver.observe(imgEl); }
        applyBadge(id);
      }

      // Refresh (or first-load) only cameras with at least one on-screen <img>.
      const imgObserver = ('IntersectionObserver' in window)
        ? new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              const ref = entry.target.__ref;
              if (!ref) return;
              ref.visible = entry.isIntersecting;
              if (entry.isIntersecting) {
                const id = entry.target.__camId;
                if (!lastGoodSrc[id]) refreshCamera(id);
              }
            });
          }, { rootMargin: '400px' })
        : null;

      function clearImgRefs() {
        if (imgObserver) imgObserver.disconnect();
        Object.keys(imgRefs).forEach(k => delete imgRefs[k]);
        Object.keys(retryState).forEach(k => {
          if (retryState[k].timer) clearTimeout(retryState[k].timer);
          delete retryState[k];
        });
      }

      const SHOW_AFTER = 3; // show overlay only after this many consecutive fails

      // ---------- Freshness badges ----------
      // A frame's capture time (Last-Modified) can only be read for hosts that
      // send CORS headers; the browser blocks it for the rest. So we measure the
      // real age where we can, flag the known daytime-only air-quality cams by
      // URL, and otherwise assume the feed is live.
      const AIRQUALITY_RE = /featurecontent\/ard\/webcams/i;
      const AGE_READABLE_RE = /volcanoes\.usgs\.gov|cdn\.pixelcaster\.com/i;
      const STALE_MS = 60 * 60 * 1000;   // frames older than 1h count as stale
      const AGE_CHECK_MS = 60 * 1000;    // re-measure a given cam at most this often
      const ageInfo = {};                // id -> { at, ms } ; ms = last measured age

      function humanAge(ms) {
        const m = Math.round(ms / 60000);
        if (m < 60) return m + 'm';
        const h = Math.round(m / 60);
        return h < 24 ? h + 'h' : Math.round(h / 24) + 'd';
      }

      function setBadge(el, state, label) {
        if (!el) return;
        el.classList.remove('warn', 'bad', 'stream');
        if (state === 'offline') el.classList.add('bad');
        else if (state === 'stream') el.classList.add('stream');
        else if (state !== 'live' && state !== 'online') el.classList.add('warn');
        const lab = el.querySelector('.badge-label');
        if (lab) lab.textContent = label;
      }

      // Resting badge for a camera. (Offline is applied separately on load failure.)
      function applyBadge(id) {
        const cam = camById(id);
        if (!cam) return;
        const rec = ageInfo[id];
        // Refreshing still images are "Online"; reserve "Live" for cams that
        // also offer an actual live video feed (cam.live). Video embeds are
        // badged "Stream" elsewhere.
        let state = cam.live ? 'live' : 'online', label = cam.live ? 'Live' : 'Online';
        if (cam.off) {
          // NPS lists this camera as inactive.
          state = 'offline'; label = 'Offline';
        } else if (rec && rec.ms != null && rec.ms > STALE_MS) {
          state = 'stale'; label = 'Stale · ' + humanAge(rec.ms);
        } else if ((!rec || rec.ms == null) && AIRQUALITY_RE.test(cam.url)) {
          // NPS air-quality cams: we can't read their age (no CORS), and update
          // cadence varies (some are near-live, others daytime-only), so use a
          // neutral label instead of claiming they're frozen overnight.
          state = 'daytime'; label = 'Air Quality';
        }
        (imgRefs[id] || []).forEach(r => {
          setBadge(r.badge, state, label);
          if (r.time) r.time.textContent = ageLabel(id, cam);
        });
        if (id === activeId) updateUpdatedLabel(id);
      }

      // Bottom-right card label: only show a real, measured frame age. We don't
      // claim "live" for feeds we can't verify (some may be stale). Empty when
      // unknown; "offline" for inactive cams.
      function ageLabel(id, cam) {
        const rec = ageInfo[id];
        if (cam.off) return 'offline';
        if (rec && rec.ms != null) return 'updated ' + humanAge(rec.ms) + ' ago';
        return '';
      }

      // Detail-stage "Updated Nm ago" readout, shown only when we have a real
      // measured frame age (CORS-readable hosts); hidden otherwise.
      function updateUpdatedLabel(id) {
        if (!stageUpdated) return;
        const rec = ageInfo[id];
        if (rec && rec.ms != null) {
          stageUpdated.textContent = 'updated ' + humanAge(rec.ms) + ' ago';
          stageUpdated.hidden = false;
        } else {
          stageUpdated.hidden = true;
        }
      }

      // For CORS-readable hosts, HEAD the frame and read Last-Modified to get its
      // true age. Throttled per camera; silently skips hosts that block CORS.
      function checkAge(id) {
        const cam = camById(id);
        if (!cam || !AGE_READABLE_RE.test(cam.url)) return;
        const now = Date.now();
        const rec = ageInfo[id];
        if (rec && now - rec.at < AGE_CHECK_MS) return;
        ageInfo[id] = { at: now, ms: rec ? rec.ms : null };
        fetch(bust(cam.url), { method: 'HEAD', cache: 'no-store' })
          .then(r => {
            const lm = r.headers.get('last-modified');
            if (!lm) return;
            ageInfo[id] = { at: Date.now(), ms: Date.now() - new Date(lm).getTime() };
            applyBadge(id);
          })
          .catch(() => {});
      }

      // Preload the next frame off-screen; only swap it into the visible <img>
      // elements once it has fully loaded. A failed cache-busted fetch never
      // wipes the last good frame, and the overlay only shows before the first
      // successful load.
      function refreshCamera(id) {
        const cam = camById(id);
        if (!cam || cam.type === 'stream') return;
        const refs = imgRefs[id] || [];
        if (!refs.length) return;

        const state = retryState[id] || (retryState[id] = { tries: 0, timer: null });
        const src = bust(cam.url);
        const loader = new Image();

        loader.onload = () => {
          state.tries = 0;
          lastGoodSrc[id] = src;
          refs.forEach(r => {
            r.el.src = src;
            if (r.onOk) r.onOk();
          });
          applyBadge(id);
          checkAge(id);
        };
        loader.onerror = () => {
          state.tries += 1;
          // Only surface the overlay if we have never shown a good frame yet.
          const neverLoaded = refs.every(r => !r.el.naturalWidth);
          if (neverLoaded && state.tries >= SHOW_AFTER) {
            refs.forEach(r => { if (r.onFail) r.onFail(); });
            refs.forEach(r => setBadge(r.badge, 'offline', 'Offline'));
          }
          const delay = Math.min(700 * state.tries, 5000);
          if (state.timer) clearTimeout(state.timer);
          state.timer = setTimeout(() => refreshCamera(id), delay);
        };
        loader.src = src;
      }

      function refreshAll() {
        // Refresh every camera that currently has a visible <img> registered
        // (current park, favorites, sidebar, or search results). Streams have no
        // registered image, so they are naturally skipped. With the observer
        // active, offscreen tiles are skipped until they scroll into view.
        Object.keys(imgRefs).forEach(id => {
          const refs = imgRefs[id] || [];
          if (!imgObserver || refs.some(r => r.visible)) refreshCamera(id);
        });
      }


      // ---------- Build grid ----------
      const STAR = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
        '<path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.9l-5.81 3.06 1.11-6.47L2.6 9.9l6.5-.95L12 2.5z"/></svg>';

      function makeCard(cam, showPark) {
        const card = document.createElement('div');
        card.className = 'card';
        const subtitle = showPark
          ? parkNameOf(cam.id) + ' · ' + areaOf(cam.id)
          : (cam.type === 'stream' ? 'live stream' : '');
        const isStream = cam.type === 'stream';
        const poster = isStream ? streamPoster(cam) : null;
        const media = isStream
          ? (poster ? '<img alt="' + cam.name + '" src="' + poster + '" />' : '<span class="noposter"></span>') +
            '<span class="playbtn"></span>'
          : '<img alt="' + cam.name + '" /><div class="imgError" hidden>Unavailable</div>';
        const badgeHtml = isStream
          ? '<span class="badge stream"><span class="dot"></span> <span class="badge-label">Stream</span></span>'
          : '<span class="badge"><span class="dot"></span> <span class="badge-label">Live</span></span>';
        card.innerHTML =
          '<div class="thumb">' + badgeHtml +
            '<button class="star' + (isFav(cam.id) ? ' on' : '') + '" title="Pin to favorites">' + STAR + '</button>' +
            media +
          '</div>' +
          '<div class="meta">' +
            '<span class="name">' + cam.name + '</span>' +
            '<span class="time">' + subtitle + '</span>' +
          '</div>';
        const star = card.querySelector('.star');
        if (!isStream) {
          const img = card.querySelector('img');
          const err = card.querySelector('.imgError');
          const badge = card.querySelector('.badge');
          // Only cards in the current-park view (no park subtitle) get a live
          // age readout; favorites/search cards keep their "Park · Area" label.
          const timeEl = showPark ? null : card.querySelector('.time');
          registerImg(cam.id, img, () => { err.hidden = true; }, () => { err.hidden = false; }, badge, timeEl);
        }
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFav(cam.id);
          buildGrid();
        });
        card.addEventListener('click', () => openDetail(cam.id));
        return card;
      }

      function gridSection(title, cams, showPark) {
        const section = document.createElement('div');
        section.className = 'area';
        const heading = document.createElement('h2');
        heading.className = 'area-title';
        heading.textContent = title;
        section.appendChild(heading);
        const row = document.createElement('div');
        row.className = 'area-grid';
        cams.forEach(cam => row.appendChild(makeCard(cam, showPark)));
        section.appendChild(row);
        return section;
      }

      function gridEmpty(msg) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = msg;
        grid.appendChild(d);
      }

      function buildGrid() {
        grid.innerHTML = '';

        // Search mode: match cameras across every park, grouped by park.
        if (searchText) {
          let total = 0;
          PARKS.forEach(p => {
            const cams = p.areas.flatMap(a => a.cameras).filter(passesFilters);
            if (cams.length) { total += cams.length; grid.appendChild(gridSection(p.park, cams, true)); }
          });
          if (!total) gridEmpty('No cameras match “' + searchText + '”.');
          return;
        }

        // Favorites section (filtered).
        const favs = favCameras().filter(passesFilters);
        if (favs.length) grid.appendChild(gridSection('★ Favorites', favs, true));

        // Current park, grouped by area (filtered).
        let shown = favs.length;
        AREAS.forEach(group => {
          const cams = group.cameras.filter(passesFilters);
          if (cams.length) { shown += cams.length; grid.appendChild(gridSection(group.area, cams, false)); }
        });
        if (!shown) gridEmpty('No cameras match the current filters.');
      }

      // ---------- Build detail sidebar ----------
      function makeSideCam(cam) {
        const el = document.createElement('div');
        el.className = 'side-cam' + (cam.id === activeId ? ' active' : '');
        el.innerHTML =
          '<div class="stub"><img alt="' + cam.name + '" /></div>' +
          '<div class="label"><span>' + cam.name + '</span>' +
          (isFav(cam.id) ? '<span class="mini-star">' + STAR + '</span>' : '<span class="dot"></span>') +
          '</div>';
        const img = el.querySelector('img');
        if (cam.type === 'stream') {
          const p = streamPoster(cam);
          if (p) img.src = p;
        } else {
          registerImg(cam.id, img);
        }
        el.addEventListener('click', () => openDetail(cam.id));
        return el;
      }

      function buildSidebar() {
        sideList.innerHTML = '';

        const favs = favCameras();
        if (favs.length) {
          const heading = document.createElement('h2');
          heading.textContent = '★ Favorites';
          sideList.appendChild(heading);
          favs.forEach(cam => sideList.appendChild(makeSideCam(cam)));
        }

        AREAS.forEach(group => {
          const heading = document.createElement('h2');
          heading.textContent = group.area;
          sideList.appendChild(heading);
          group.cameras.forEach(cam => sideList.appendChild(makeSideCam(cam)));
        });
      }

      // ---------- Navigation ----------
      function updateFavBtn() {
        const on = isFav(activeId);
        stageFav.textContent = on ? '★ Favorited' : '☆ Favorite';
        stageFav.classList.toggle('on', on);
      }

      function openDetail(id) {
        const cam = camById(id);
        // YouTube live embeds fail from file:// (Error 153 — null origin); open on
        // YouTube instead. Served over http(s) they embed inline in the stage.
        if (cam && cam.type === 'stream' && !canEmbedInline(cam)) {
          window.open(streamWatch(cam), '_blank', 'noopener'); return;
        }
        activeId = id;
        // If this camera lives in another park (e.g. opened from a global
        // favorite), switch the park context so the sidebar/refresh match.
        const pIdx = parkIndexOf(id);
        if (pIdx !== -1 && pIdx !== parkIndex) {
          parkIndex = pIdx;
          AREAS = PARKS[parkIndex].areas;
          parkSelect.value = String(parkIndex);
          brandSub.textContent = PARKS[parkIndex].park;
        }
        clearImgRefs();
        stageTitle.textContent = cam.name;
        stageArea.textContent = parkNameOf(id) + ' · ' + areaOf(id);
        updateFavBtn();
        const isStream = cam.type === 'stream';
        stageSave.hidden = isStream;
        stageRefresh.hidden = isStream;
        stageCount.hidden = isStream;
        stageWatch.hidden = !isStream;
        stageUpdated.hidden = true;
        // Image cameras backed by a live feed get a link to the livestream page.
        stageLive.hidden = isStream || !cam.live;
        if (cam.live) stageLive.href = cam.live;
        if (isStream) {
          stageImage.hidden = true;
          const frame = replaceStageStream();
          frame.hidden = false;
          frame.src = streamEmbedSrc(cam);
          setBadge(stageBadge, 'stream', 'Stream');
          stageWatch.href = streamWatch(cam);
          stageWatch.textContent = ytId(cam.embed) ? 'Watch on YouTube ↗' : 'Open live ↗';
        } else {
          replaceStageStream();
          stageImage.hidden = false;
          registerImg(id, stageImage, null, null, stageBadge);
          updateUpdatedLabel(id);
        }
        buildSidebar();
        gridView.hidden = true;
        detailView.hidden = false;
        backBtn.style.display = 'inline-flex';
        refreshAll();
        resetTimer();
        updateHash();
        updateBrandLink();
        saveSession();
        window.scrollTo(0, 0);
      }

      // Point the header title at the current park's nps.gov page.
      function updateBrandLink() {
        const code = PARK_CODES[PARKS[parkIndex].park];
        if (code) {
          brandSub.href = 'https://www.nps.gov/' + code + '/index.htm';
          brandSub.title = 'Visit ' + PARKS[parkIndex].park + ' on nps.gov';
        } else {
          brandSub.removeAttribute('href');
          brandSub.removeAttribute('title');
        }
      }

      function openGrid() {
        activeId = null;
        clearImgRefs();
        if (stageStream && stageStream.src) replaceStageStream();
        buildGrid();
        detailView.hidden = true;
        gridView.hidden = false;
        backBtn.style.display = 'none';
        refreshAll();
        resetTimer();
        updateHash();
        updateBrandLink();
        saveSession();
      }

      // "← All cameras" always returns to the current park's grid, regardless
      // of how many cameras were visited via the sidebar (don't step back one).
      backBtn.addEventListener('click', () => { openGrid(); });
      stageRefresh.addEventListener('click', () => { refreshAll(); resetTimer(); });
      stageFav.addEventListener('click', () => {
        toggleFav(activeId);
        updateFavBtn();
        buildSidebar();
      });

      // Download the exact frame currently on screen (not a fresh fetch), so the
      // image the user is looking at is what gets saved even if a newer frame
      // arrives moments later. Uses the already-loaded src.
      async function saveCurrent() {
        const cam = camById(activeId);
        if (!cam || cam.type === 'stream' || !stageImage.src) return;
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const fileName = cam.id + '_' + stamp + '.jpg';
        const url = stageImage.src;
        const original = stageSave.textContent;
        stageSave.textContent = 'Saving…';
        stageSave.disabled = true;
        try {
          const resp = await fetch(url, { cache: 'force-cache' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const blob = await resp.blob();

          // Preferred: native "Save As" dialog via File System Access API.
          if (window.showSaveFilePicker) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JPEG image', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }],
              });
              const writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              return;
            } catch (pickErr) {
              // User cancelled the dialog — abort without falling back.
              if (pickErr && pickErr.name === 'AbortError') return;
              // Otherwise (e.g. unsupported context) fall through to anchor download.
            }
          }

          // Fallback: anchor download (saves to default folder or asks,
          // depending on the browser's download settings).
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = objectUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
        } catch (e) {
          // Last resort: open in a new tab so the user can right-click → Save.
          window.open(url, '_blank', 'noopener');
        } finally {
          stageSave.textContent = original;
          stageSave.disabled = false;
        }
      }

      stageSave.addEventListener('click', saveCurrent);

      // Copy a shareable link to the current view (the URL hash is deep-linkable).
      async function shareCurrent() {
        const url = location.href;
        const done = (ok) => {
          const original = 'Share';
          stageShare.textContent = ok ? 'Copied!' : 'Copy failed';
          stageShare.disabled = true;
          setTimeout(() => { stageShare.textContent = original; stageShare.disabled = false; }, 1500);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(url);
          } else {
            // Fallback for insecure/older contexts.
            const ta = document.createElement('textarea');
            ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            if (!ok) throw new Error('execCommand failed');
          }
          done(true);
        } catch (e) {
          done(false);
        }
      }

      stageShare.addEventListener('click', shareCurrent);

      // ---------- Timer ----------
      function resetTimer() { remaining = intervalSeconds(); updateCount(); }
      function updateCount() { stageCount.textContent = 'next in ' + remaining + 's'; }

      function tick() {
        remaining -= 1;
        if (remaining <= 0) {
          refreshAll();
          remaining = intervalSeconds();
        }
        updateCount();
      }

      intervalInput.addEventListener('change', () => { resetTimer(); saveSession(); });

      // ---------- Park switching ----------
      function populateParks() {
        parkSelect.innerHTML = '';
        // Sort options alphabetically by park name, but keep each option's
        // value as its original index into PARKS.
        PARKS.map((p, i) => ({ name: p.park, i }))
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach(({ name, i }) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = name;
            parkSelect.appendChild(opt);
          });
        parkSelect.value = String(parkIndex);
        brandSub.textContent = PARKS[parkIndex].park;
      }

      parkSelect.addEventListener('change', () => {
        parkIndex = parseInt(parkSelect.value, 10) || 0;
        AREAS = PARKS[parkIndex].areas;
        brandSub.textContent = PARKS[parkIndex].park;
        if (searchText) { searchText = ''; searchInput.value = ''; }
        openGrid(); // return to grid for the newly selected park
      });

      // ---------- Search + filter controls ----------
      // Re-render the grid for a search/filter change (leaving detail if open).
      function applyGridChange() {
        if (activeId !== null) { openGrid(); return; }
        clearImgRefs();
        if (stageStream && stageStream.src) replaceStageStream();
        buildGrid();
        refreshAll();
        resetTimer();
      }
      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          const v = searchInput.value.trim().toLowerCase();
          if (v === searchText) return;
          searchText = v;
          applyGridChange();
        }, 180);
      });
      chipOffline.addEventListener('click', () => { hideOffline = !hideOffline; chipOffline.classList.toggle('on', hideOffline); applyGridChange(); });
      chipStreams.addEventListener('click', () => { streamsOnly = !streamsOnly; chipStreams.classList.toggle('on', streamsOnly); applyGridChange(); });

      // ---------- Keyboard navigation ----------
      // Cameras in the current park that can be shown inline (skip streams that
      // would open an external tab, so arrow-stepping never launches new tabs).
      function navigableCameras() {
        return currentCameras().filter(c => !(c.type === 'stream' && !canEmbedInline(c)));
      }
      function stepDetail(dir) {
        const list = navigableCameras();
        if (!list.length) return;
        const i = list.findIndex(c => c.id === activeId);
        const next = list[(i + dir + list.length) % list.length];
        if (next) openDetail(next.id);
      }
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target;
        const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
        // "/" focuses search from anywhere except while typing.
        if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
        if (typing) { if (e.key === 'Escape') t.blur(); return; }
        if (e.key === 'Escape') {
          if (activeId !== null) { e.preventDefault(); openGrid(); }
        } else if (activeId !== null && (e.key === 'ArrowRight' || e.key === 'ArrowDown')) {
          e.preventDefault(); stepDetail(1);
        } else if (activeId !== null && (e.key === 'ArrowLeft' || e.key === 'ArrowUp')) {
          e.preventDefault(); stepDetail(-1);
        }
      });

      // ---------- Init ----------
      (function initState() {
        suppressHistory = true;
        const hash = location.hash.slice(1);
        let camId = null, pIdx = null, interval = null;
        if (hash) {
          const parts = hash.split('/');
          if (parts[1] && camById(parts[1])) camId = parts[1];
          else { const i = parkIndexBySlug(parts[0]); if (i !== -1) pIdx = i; }
        }
        if (camId === null && pIdx === null) {
          try {
            const s = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
            if (s.park) { const i = parkIndexBySlug(s.park); if (i !== -1) pIdx = i; }
            if (s.interval) interval = s.interval;
          } catch (e) {}
        }
        if (interval) intervalInput.value = interval;
        if (pIdx !== null) { parkIndex = pIdx; AREAS = PARKS[parkIndex].areas; }
        populateParks();
        if (camId) {
          const cam = camById(camId);
          if (cam && cam.type === 'stream' && !canEmbedInline(cam)) {
            const i = parkIndexOf(camId);
            if (i !== -1) { parkIndex = i; AREAS = PARKS[i].areas; parkSelect.value = String(i); brandSub.textContent = PARKS[i].park; }
            buildGrid(); refreshAll();
          } else {
            openDetail(camId);
          }
        } else {
          buildGrid();
          refreshAll();
        }
        updateHash();
        updateBrandLink();
        suppressHistory = false;
        resetTimer();
      })();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
