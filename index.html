<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="description" content="Live U.S. National Park Service webcams — refreshing images and video streams across ~35 national parks." />
  <!-- Installable web app (inline, single-file). iOS uses these meta tags; the
       icon + manifest are generated at runtime by the script below. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Park Cams" />
  <title>NPS Cams</title>
  <script>
    // Generate the app icon (canvas → PNG) and a web-app manifest at runtime so
    // the app stays a single file yet is installable / add-to-home-screen.
    (function () {
      function drawIcon(size, maskable) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const x = c.getContext('2d');
        const s = size / 512;              // scale from a 512 design grid
        // Background (full-bleed so maskable icons have no transparent corners).
        const g = x.createLinearGradient(0, 0, 0, size);
        g.addColorStop(0, '#141a24'); g.addColorStop(1, '#0b0e13');
        x.fillStyle = g; x.fillRect(0, 0, size, size);
        // Sun.
        x.fillStyle = '#e6b450';
        x.beginPath(); x.arc(340 * s, 168 * s, 46 * s, 0, Math.PI * 2); x.fill();
        // Back mountain (blue).
        x.fillStyle = '#2f5f9e';
        x.beginPath();
        x.moveTo(70 * s, 380 * s); x.lineTo(230 * s, 190 * s); x.lineTo(330 * s, 300 * s);
        x.lineTo(300 * s, 330 * s); x.lineTo(360 * s, 380 * s); x.closePath(); x.fill();
        // Front mountain (green) with a snow cap.
        x.fillStyle = '#2f8f57';
        x.beginPath();
        x.moveTo(150 * s, 400 * s); x.lineTo(300 * s, 210 * s); x.lineTo(450 * s, 400 * s);
        x.closePath(); x.fill();
        x.fillStyle = '#e6edf3';
        x.beginPath();
        x.moveTo(300 * s, 210 * s); x.lineTo(340 * s, 262 * s); x.lineTo(318 * s, 268 * s);
        x.lineTo(300 * s, 250 * s); x.lineTo(282 * s, 268 * s); x.lineTo(260 * s, 262 * s);
        x.closePath(); x.fill();
        // Ground line.
        x.fillStyle = '#0b0e13'; x.fillRect(0, 400 * s, size, size - 400 * s);
        return c.toDataURL('image/png');
      }
      try {
        const icon = drawIcon(512, true);
        const link = (rel, extra) => { const l = document.createElement('link'); l.rel = rel; Object.assign(l, extra); document.head.appendChild(l); return l; };
        link('apple-touch-icon', { href: icon });
        link('icon', { href: icon, type: 'image/png', sizes: '512x512' });
        const manifest = {
          name: 'National Park Webcams', short_name: 'Park Cams',
          description: 'Live U.S. National Park Service webcams.',
          start_url: '.', scope: '.', display: 'standalone',
          background_color: '#0b0e13', theme_color: '#0b0e13',
          icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        link('manifest', { href: URL.createObjectURL(blob) });
      } catch (e) { /* non-fatal: app still works without install metadata */ }
    })();
  </script>
  <style>
    :root {
      --bg: #0b0e13;
      --panel: #12161d;
      --panel-2: #171c25;
      --border: #232a35;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #4b98ff;
      --danger: #f85149;
      --live: #3fb950;
      --warn: #d29922;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    /* ---------- Modern scrollbars ---------- */
    * {
      scrollbar-width: thin;
      scrollbar-color: #2d3542 transparent;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d3542;
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3d4757;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    html, body { height: 100%; }
    /* Solid dark canvas so orientation changes / overscroll never flash white. */
    html { background: var(--bg); }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #141a24 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,14,19,.72);
    }
    .brand { display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
    .brand .eyebrow {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
    }
    .brand h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .brand h1 a { color: inherit; text-decoration: none; }
    .brand h1 a[href]:hover { color: var(--accent-hover); text-decoration: underline; }
    .brand h1 a[href]::after { content: " \2197"; font-size: .7em; color: var(--muted); font-weight: 600; }
    .topbar .spacer { flex: 1; }

    .backBtn {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .backBtn:hover { background: #1e2530; border-color: #313a48; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
    }
    .pill input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .pill select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      cursor: pointer;
      font-weight: 600;
    }
    .pill select option { background: var(--panel-2); color: var(--text); }
    .pill.search { flex: 1 1 200px; min-width: 150px; }
    .pill.search input { width: auto; flex: 1; text-align: left; }
    .pill.search svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; flex: none; }
    .pill.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
    .chip {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: background .15s, border-color .15s, color .15s;
    }
    .chip:hover { border-color: #313a48; }
    .chip.on { background: rgba(47,129,247,.15); border-color: var(--accent); color: var(--accent-hover); }
    a.iconBtn { text-decoration: none; }
    .empty { padding: 48px 24px; color: var(--muted); font-size: 14px; text-align: center; }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(63,185,80,.15);
    }

    /* ---------- Views ---------- */
    .view { flex: 1; padding: 24px; }
    .view[hidden] { display: none; }

    /* Home view hides park/refresh/filter controls that only apply to a park. */
    body[data-view="home"] .park-pill,
    body[data-view="home"] .refresh-pill,
    body[data-view="home"] #chipOffline,
    body[data-view="home"] #chipStreams { display: none; }
    .eyebrow-home {
      font: inherit;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }
    .eyebrow-home:hover { color: var(--accent-hover); }

    /* ---------- Home / landing ---------- */
    .home { display: flex; flex-direction: column; gap: 34px; max-width: 1400px; margin: 0 auto; }
    .hero {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        radial-gradient(900px 300px at 15% -40%, rgba(47,129,247,.20), transparent 60%),
        radial-gradient(700px 260px at 95% -30%, rgba(63,185,80,.16), transparent 60%),
        var(--panel);
      padding: 30px 28px;
    }
    .hero-title { margin: 0 0 8px; font-size: 30px; font-weight: 750; letter-spacing: .2px; }
    .hero-sub { margin: 0; max-width: 640px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .hero-sub strong { color: var(--text); font-weight: 700; }

    /* Landing-page US map: a clean, stylized silhouette with a marker per park.
       Dependency-free — the outline paths and markers are inline SVG. */
    .home-map .area-title { margin-bottom: 16px; }
    .map-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        radial-gradient(800px 340px at 50% -20%, rgba(47,129,247,.10), transparent 65%),
        var(--panel);
      padding: 12px 14px;
    }
    .us-map { display: block; width: 100%; height: auto; }
    .us-map .land { fill: #17233b; stroke: #35507f; stroke-width: .8; stroke-linejoin: round; }
    .us-map .inset-box { fill: none; stroke: var(--border); stroke-width: 1; }
    .us-map .inset-label { fill: var(--muted); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; }
    .us-map .pin {
      cursor: pointer;
      fill: var(--accent);
      stroke: #0b1220;
      stroke-width: 1;
      transition: fill .12s ease, r .12s ease;
    }
    .us-map .pin:hover, .us-map .pin.hot { fill: #7cc0ff; }
    .us-map .pin-hit { cursor: pointer; fill: transparent; }
    .map-tip {
      position: absolute;
      pointer-events: none;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transform: translate(-50%, -130%);
      opacity: 0;
      transition: opacity .12s ease;
      z-index: 5;
    }
    .map-tip .tip-sub { color: var(--muted); font-weight: 500; }

    .home-parks .area-title { margin-bottom: 16px; }
    .park-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }
    .park-card {
      position: relative;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #000;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .park-card:hover {
      transform: translateY(-3px);
      border-color: #33507e;
      box-shadow: var(--shadow);
    }
    .park-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform .3s ease;
    }
    .park-card:hover img { transform: scale(1.05); }
    .park-card .pc-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.25) 48%, rgba(0,0,0,.05) 100%);
      pointer-events: none;
    }
    .park-card .pc-noimg { position: absolute; inset: 0; background: linear-gradient(135deg,#1b2431,#0d1117); }
    .park-card .pc-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px; }
    .park-card .pc-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .park-card .pc-count { font-size: 11px; color: rgba(255,255,255,.72); margin-top: 2px; font-variant-numeric: tabular-nums; }

    /* ---------- Grid (preview) ---------- */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .area-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 650;
      margin: 0 2px 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .area-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #33507e;
      box-shadow: var(--shadow);
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .badge {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      padding: 5px 9px;
      border-radius: 999px;
      color: #fff;
    }
    .badge .dot { width: 7px; height: 7px; }
    .badge.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(210,153,34,.18); }
    .badge.bad  .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(248,81,73,.18); }
    .badge.warn .badge-label { color: #f2cc60; }
    .badge.bad  .badge-label { color: #ff9d95; }
    .badge.stream .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(47,129,247,.22); }
    .badge.stream .badge-label { color: #9ec5ff; }
    /* Neutral pending state until the first frame confirms the feed is up. */
    .badge.loading .dot { background: #8b949e; box-shadow: 0 0 0 3px rgba(139,148,158,.18); animation: badgePulse 1.1s ease-in-out infinite; }
    .badge.loading .badge-label { color: #c2ccd6; }
    @keyframes badgePulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    .thumb .noposter { position: absolute; inset: 0; background: linear-gradient(135deg,#1b2431,#0d1117); }
    #stageStream { width: 100%; height: 100%; border: 0; }
    .thumb .playbtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .thumb .playbtn::after { content: ''; border-style: solid; border-width: 10px 0 10px 17px; border-color: transparent transparent transparent #fff; margin-left: 3px; }
    /* Pill on stream tiles that open in a new tab (YouTube on file://, HDOnTap). */
    .thumb .ext-tag {
      position: absolute; bottom: 10px; right: 10px;
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600; letter-spacing: .3px;
      background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
      color: #cdd7e2; padding: 4px 8px; border-radius: 999px;
      pointer-events: none;
    }

    /* ---------- Favorite star (on thumbnails) ---------- */
    .star {
      position: absolute;
      top: 8px; right: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
      color: rgba(255,255,255,.75);
      transition: background .15s, color .15s, transform .12s;
      padding: 0;
    }
    .star svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .star:hover { background: rgba(0,0,0,.7); transform: scale(1.08); }
    .star.on { color: #f5c518; }
    .star.on svg { fill: #f5c518; stroke: #f5c518; }

    .mini-star {
      display: inline-flex;
      color: #f5c518;
    }
    .mini-star svg { width: 13px; height: 13px; fill: #f5c518; stroke: #f5c518; }

    .favBtn.on {
      color: #f5c518;
      border-color: rgba(245,197,24,.5);
    }

    .card .meta {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card .meta .name { font-size: 14px; font-weight: 600; }
    .card .meta .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---------- Detail ---------- */
    .detail {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 20px;
      height: calc(100vh - 73px - 48px);
    }
    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stage-img {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .stage-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .stage-img img[hidden] { display: none; }
    .stage-img.zoomable img { cursor: zoom-in; }
    /* Overlay fullscreen toggle on the image (image cameras only). */
    .fsBtn {
      position: absolute;
      top: 10px; right: 10px;
      width: 34px; height: 34px;
      display: none;
      align-items: center; justify-content: center;
      border: none; border-radius: 8px; padding: 0;
      background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
      color: rgba(255,255,255,.85); cursor: pointer;
      transition: background .15s, transform .12s;
    }
    .stage-img.zoomable .fsBtn { display: inline-flex; }
    .fsBtn:hover { background: rgba(0,0,0,.72); transform: scale(1.06); }
    .fsBtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fsBtn .icon-exit { display: none; }
    /* Native fullscreen: the whole stage goes fullscreen so the info/button bar
       stays visible; the image area fills the remaining space on black. */
    .stage:fullscreen { width: 100vw; height: 100vh; border: 0; border-radius: 0; }
    .stage:fullscreen .stage-img { background: #000; }
    /* Scale small webcam frames up to fill the fullscreen frame (aspect ratio
       preserved via object-fit; upscaling is smoothed). */
    .stage:fullscreen .stage-img img {
      width: 100%; height: 100%;
      max-width: none; max-height: none;
      object-fit: contain;
      cursor: zoom-out;
    }
    .stage.is-full .fsBtn .icon-enter { display: none; }
    .stage.is-full .fsBtn .icon-exit { display: inline; }

    .stage-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    .stage-bar .title { font-size: 15px; font-weight: 650; }
    .stage-bar .title a { color: inherit; text-decoration: none; }
    .stage-bar .title a[href]:hover { color: var(--accent-hover); text-decoration: underline; }
    .stage-bar .title a[href]::after { content: " \2197"; font-size: .8em; color: var(--muted); font-weight: 600; }
    .stage-bar .area-tag {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .stage-bar .spacer { flex: 1; }
    .stage-bar .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .stage-bar .weather {
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .stage-bar .weather .wx-icon { font-size: 14px; line-height: 1; }

    .iconBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .iconBtn:hover { background: #1e2530; border-color: #313a48; }
    /* Icon + label buttons (e.g. Share). */
    .iconBtn:has(.ic) { display: inline-flex; align-items: center; gap: 7px; }
    /* Keep the `hidden` attribute authoritative — the display rule above would
       otherwise re-show buttons we hide for streams (e.g. Save image). */
    .iconBtn[hidden] { display: none; }
    .iconBtn .ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 4px 2px;
      font-weight: 600;
    }
    /* On desktop the toggle is a static heading; the list is always shown. */
    .sidebar-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
      padding: 2px 2px 6px;
      cursor: default;
    }
    .sidebar-toggle .st-chev { display: none; }
    /* Collapsible camera groups within the sidebar. */
    .side-group { margin-bottom: 6px; }
    .side-group-head {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      background: none;
      border: none;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
      padding: 6px 2px;
      cursor: pointer;
      text-align: left;
    }
    .side-group-head:hover { color: var(--text); }
    .side-group-head .sg-chev {
      width: 7px; height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform .18s ease;
      flex: none;
    }
    .side-group.collapsed .sg-chev { transform: rotate(-45deg); }
    .side-group .sg-count { color: #5c6470; font-weight: 600; }
    .side-group.collapsed .sg-body { display: none; }
    .side-cam {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .side-cam:hover { transform: translateY(-2px); border-color: #33507e; }
    .side-cam.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    /* Space between feeds in the panel (desktop block list); mobile uses flex gap. */
    #sideList .side-cam { margin-bottom: 12px; }
    .sg-body .side-cam:last-child { margin-bottom: 0; }
    .side-cam .stub {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .side-cam .stub img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .side-cam .stub .imgError { font-size: 11px; }
    .side-cam .label {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .side-cam .label .dot { width: 6px; height: 6px; }
    .side-cam .label .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px rgba(248,81,73,.15); }

    .imgError {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      font-size: 12px;
      background: repeating-linear-gradient(45deg, #14181f, #14181f 10px, #171c25 10px, #171c25 20px);
    }
    .imgError[hidden] { display: none; }

    @media (max-width: 820px) {
      /* Detail fills the space under the top bar; the stage is fixed on top and
         the "other cameras" panel scrolls internally (mirrors desktop), so the
         current camera stays put while browsing others. */
      #detailView { padding: 10px; }
      .detail {
        display: flex;
        flex-direction: column;
        gap: 0;
        height: calc(100vh - var(--topbar-h, 56px) - 20px);
        height: calc(100dvh - var(--topbar-h, 56px) - 20px);
      }
      /* On the detail page these are grid-browsing controls; hide them so the
         pinned camera header stays compact (search still works via back/grid). */
      body[data-view="detail"] .park-pill,
      body[data-view="detail"] .refresh-pill,
      body[data-view="detail"] #chipOffline,
      body[data-view="detail"] #chipStreams,
      body[data-view="detail"] .pill.search { display: none; }
      .stage { flex: 0 0 auto; }
      .stage-img { max-height: 46vh; min-height: 200px; }
      /* The panel is the scroll container; its header sticks at the top so the
         list can be collapsed/expanded without scrolling back up. */
      .sidebar {
        display: block;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        margin-top: 12px;
      }
      .sidebar-toggle {
        position: sticky;
        top: 0;
        z-index: 5;
        cursor: pointer;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 12px;
      }
      .sidebar-toggle .st-chev {
        display: inline-block;
        width: 8px; height: 8px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
        transition: transform .18s ease;
        margin-right: 3px;
      }
      .sidebar.collapsed .sidebar-toggle .st-chev { transform: rotate(-45deg); }
      /* Vertical camera list under the sticky header. */
      #sideList { margin-top: 12px; }
      .sg-body { display: flex; flex-direction: column; gap: 12px; }
      #sideList .side-cam { margin-bottom: 0; }
      .sidebar.collapsed #sideList { display: none; }
      .side-cam { min-width: 0; }
    }

    /* ---------- Phones ---------- */
    @media (max-width: 560px) {
      .topbar { padding: 11px 14px; gap: 10px; }
      .view { padding: 14px; }
      .brand h1 { font-size: 18px; }
      /* Search takes its own full-width row; filters/dropdowns wrap below. */
      .pill.search { flex-basis: 100%; }
      .backBtn { padding: 7px 12px; font-size: 12px; }

      /* Home: denser park grid + smaller hero. */
      .home { gap: 22px; }
      .park-grid { grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); gap: 12px; }
      .hero { padding: 20px 18px; }
      .hero-title { font-size: 23px; }
      .hero-sub { font-size: 14px; }

      /* Detail bar wraps so its buttons never clip off the right edge. */
      .stage-bar { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
      .stage-bar .spacer { flex-basis: 100%; height: 0; }
      .stage-bar .iconBtn, .stage-bar .favBtn { flex: 1 1 auto; justify-content: center; text-align: center; }
    }
  </style>
</head>

      const STATE_KEY = 'nps-webcam-state';
      function parkSlug(name) {

      // (or skip) when re-applying an existing entry to avoid loops.
      let suppressHistory = false;

      // poster; clicking embeds the live player inline in the detail view. YouTube
      // live embeds need a real (non-file) origin, so from file:// they open on
      // YouTube instead of showing an inline "Error 153".
      function ytId(u) { const m = (u || '').match(/embed\/([\w-]+)/); return m ? m[1] : null; }
      function streamPoster(cam) { const id = ytId(cam.embed); return id ? 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg' : null; }

      // Human name of the host a non-embeddable stream opens on, for clear
      // "opens in a new tab" labeling. YouTube (on file://) and HDOnTap streams
      // can't embed inline, so we send users to the source.
      function streamHost(cam) {

        if (/hdontap\.com/i.test(cam.embed || '')) return 'HDOnTap';

      // enforces a CSP frame-ancestors rule (nps.gov / hdontap.com only), so its

      function canEmbedInline(cam) {
        if (/hdontap\.com/i.test(cam.embed || '')) return false;

      // Track live <img> elements per camera plus their status callbacks so we
      // can swap in new frames and toggle the "Unavailable" overlay.
      const imgRefs = {};      // id -> [{ el, onOk, onFail }, ...]
      const retryState = {};   // id -> { tries, timer }
      const lastGoodSrc = {};  // id -> most recently loaded frame URL (for instant swaps)

      function registerImg(id, imgEl, onOk, onFail, badgeEl, timeEl) {
        const ref = { el: imgEl, onOk: onOk, onFail: onFail, badge: badgeEl || null, time: timeEl || null, visible: !imgObserver };
        (imgRefs[id] = imgRefs[id] || []).push(ref);
        // Show the cached frame immediately so swaps feel instant. When there's
        // no cached frame for this camera, clear the element so it never shows a
        // previously-viewed camera's frame (matters for the reused stage image).
        if (lastGoodSrc[id]) {
          imgEl.src = lastGoodSrc[id];
          if (onOk) onOk();
        } else {
          imgEl.removeAttribute('src');
        }
        // Lazy-load: only fetch frames for tiles near the viewport. The observer
        // flips `visible` and kicks off the first load when a tile scrolls in.
        if (imgObserver) { imgEl.__camId = id; imgEl.__ref = ref; imgObserver.observe(imgEl); }
        applyBadge(id);
      }

      const imgObserver = ('IntersectionObserver' in window)
        ? new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              const ref = entry.target.__ref;
              if (!ref) return;
              ref.visible = entry.isIntersecting;
              if (entry.isIntersecting) {
                const id = entry.target.__camId;
                if (!lastGoodSrc[id]) refreshCamera(id);
              }
            });
          }, { rootMargin: '400px' })
        : null;

      function clearImgRefs() {
        if (imgObserver) imgObserver.disconnect();
        Object.keys(imgRefs).forEach(k => delete imgRefs[k]);
        Object.keys(retryState).forEach(k => {
          if (retryState[k].timer) clearTimeout(retryState[k].timer);
          delete retryState[k];

      const SHOW_AFTER = 3; // show overlay only after this many consecutive fails

      // ---------- Freshness badges ----------
      // A frame's capture time (Last-Modified) can only be read for hosts that
      // send CORS headers; the browser blocks it for the rest. So we measure the
      // real age where we can, flag the known daytime-only air-quality cams by
      // URL, and otherwise assume the feed is live.
      const AIRQUALITY_RE = /featurecontent\/ard\/webcams/i;
      const AGE_READABLE_RE = /volcanoes\.usgs\.gov|cdn\.pixelcaster\.com/i;
      const STALE_MS = 60 * 60 * 1000;   // frames older than 1h count as stale
      const AGE_CHECK_MS = 60 * 1000;    // re-measure a given cam at most this often
      const ageInfo = {};                // id -> { at, ms } ; ms = last measured age

      function humanAge(ms) {
        const m = Math.round(ms / 60000);
        if (m < 60) return m + 'm';
        const h = Math.round(m / 60);
        return h < 24 ? h + 'h' : Math.round(h / 24) + 'd';
      }

      function setBadge(el, state, label) {
        if (!el) return;
        el.classList.remove('warn', 'bad', 'stream', 'loading');
        if (state === 'offline') el.classList.add('bad');
        else if (state === 'stream') el.classList.add('stream');
        else if (state === 'loading') el.classList.add('loading');
        else if (state !== 'live' && state !== 'online') el.classList.add('warn');
        const lab = el.querySelector('.badge-label');
        if (lab) lab.textContent = label;
      }

      // Resting badge for a camera. (Offline is applied separately on load failure.)
      function applyBadge(id) {
        const cam = camById(id);
        if (!cam) return;
        const rec = ageInfo[id];
        // Refreshing still images are "Online"; reserve "Live" for cams that
        // also offer an actual live video feed (cam.live). Video embeds are
        // badged "Stream" elsewhere.
        let state = cam.live ? 'live' : 'online', label = cam.live ? 'Live' : 'Online';
        if (cam.off || deadIds.has(id)) {
          // NPS-inactive, or a feed that persistently fails to load.
          state = 'offline'; label = 'Offline';
        } else if (!lastGoodSrc[id]) {
          // Neutral pending state until the first frame confirms the feed is up,
          // so we never flash "Online" on a camera that turns out to be dead.
          state = 'loading'; label = 'Loading';
        } else if (rec && rec.ms != null && rec.ms > STALE_MS) {
          state = 'stale'; label = 'Stale · ' + humanAge(rec.ms);
        } else if ((!rec || rec.ms == null) && AIRQUALITY_RE.test(cam.url)) {
          // NPS air-quality cams: we can't read their age (no CORS), and update
          // cadence varies (some are near-live, others daytime-only), so use a
          // neutral label instead of claiming they're frozen overnight.
          state = 'daytime'; label = 'Air Quality';
        }
        (imgRefs[id] || []).forEach(r => {
          setBadge(r.badge, state, label);
          if (r.time) r.time.textContent = ageLabel(id, cam);
        });
        if (id === activeId) updateUpdatedLabel(id);
      }

      // Bottom-right card label: only show a real, measured frame age. We don't
      // claim "live" for feeds we can't verify (some may be stale). Empty when
      // unknown; "offline" for inactive cams.
      function ageLabel(id, cam) {
        const rec = ageInfo[id];
        if (cam.off || deadIds.has(id)) return 'offline';
        if (rec && rec.ms != null) return 'updated ' + humanAge(rec.ms) + ' ago';
        return '';
      }

      // Detail-stage "Updated Nm ago" readout, shown only when we have a real
      // measured frame age (CORS-readable hosts); hidden otherwise.
      function updateUpdatedLabel(id) {
        if (!stageUpdated) return;
        const rec = ageInfo[id];
        if (rec && rec.ms != null) {
          stageUpdated.textContent = 'updated ' + humanAge(rec.ms) + ' ago';
          stageUpdated.hidden = false;
        } else {
          stageUpdated.hidden = true;
        }
      }

      // Discreet current-weather hint on the detail stage. Prefers the camera's
      // own coordinates (CAM_COORDS, from the Solr catalog) so cameras spread
      // across a park read their actual local conditions; falls back to the
      // park center (PARK_COORDS) otherwise. Backed by Open-Meteo: free, no API
      // key, CORS-enabled. Cached per location for a while so switching between
      // nearby cameras doesn't refetch every time.
      const WEATHER_TTL_MS = 15 * 60 * 1000; // 15 min
      const weatherCache = {}; // "lat,lon" -> { at, temp, code }
      const WMO_ICONS = {
        0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
        45: '🌫️', 48: '🌫️',
        51: '🌦️', 53: '🌦️', 55: '🌦️', 56: '🌦️', 57: '🌦️',
        61: '🌧️', 63: '🌧️', 65: '🌧️', 66: '🌧️', 67: '🌧️',
        71: '🌨️', 73: '🌨️', 75: '🌨️', 77: '🌨️',
        80: '🌦️', 81: '🌧️', 82: '⛈️',
        85: '🌨️', 86: '🌨️',
        95: '⛈️', 96: '⛈️', 99: '⛈️',
      };
      const WMO_LABELS = {
        0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast',
        45: 'Fog', 48: 'Fog',
        51: 'Light drizzle', 53: 'Drizzle', 55: 'Drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle',
        61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain',
        71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains',
        80: 'Rain showers', 81: 'Rain showers', 82: 'Heavy showers',
        85: 'Snow showers', 86: 'Snow showers',
        95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm',
      };

      function updateWeather(id) {
        if (!stageWeather) return;
        const coords = CAM_COORDS[id] || PARK_COORDS[parkNameOf(id)];
        if (!coords) { stageWeather.hidden = true; return; }
        const [lat, lon] = coords;
        const key = lat + ',' + lon;
        const cached = weatherCache[key];
        if (cached && Date.now() - cached.at < WEATHER_TTL_MS) {
          renderWeather(id, cached);
          return;
        }
        // Don't blank out a stale-but-present reading while a fresh one loads.
        if (cached) renderWeather(id, cached);
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
          '&longitude=' + lon + '&current=temperature_2m,weather_code&temperature_unit=fahrenheit';
        fetch(url).then(r => r.ok ? r.json() : null).then(data => {
          const cur = data && data.current;
          if (!cur || cur.temperature_2m == null) return;
          const entry = {
            at: Date.now(),
            temp: Math.round(cur.temperature_2m),
            code: cur.weather_code,
          };
          weatherCache[key] = entry;
          renderWeather(id, entry);
        }).catch(() => {});
      }

      function renderWeather(id, entry) {
        // Guard against a slow response landing after the user moved on.
        if (activeId !== id) return;
        const icon = WMO_ICONS[entry.code] || '🌡️';
        const label = WMO_LABELS[entry.code] || '';
        stageWeather.innerHTML = '<span class="wx-icon">' + icon + '</span>' + entry.temp + '°F' + (label ? ' · ' + label : '');
        stageWeather.title = 'Current conditions near this camera (approximate)';
        stageWeather.hidden = false;
      }

      // For CORS-readable hosts, HEAD the frame and read Last-Modified to get its
      // true age. Throttled per camera; silently skips hosts that block CORS.
      function checkAge(id) {
        const cam = camById(id);
        if (!cam || !AGE_READABLE_RE.test(cam.url)) return;
        const now = Date.now();
        const rec = ageInfo[id];
        if (rec && now - rec.at < AGE_CHECK_MS) return;
        ageInfo[id] = { at: now, ms: rec ? rec.ms : null };
        fetch(bust(cam.url), { method: 'HEAD', cache: 'no-store' })
          .then(r => {
            const lm = r.headers.get('last-modified');
            if (!lm) return;
            ageInfo[id] = { at: Date.now(), ms: Date.now() - new Date(lm).getTime() };
            applyBadge(id);
          })
          .catch(() => {});
      }

      // Preload the next frame off-screen; only swap it into the visible <img>
      // elements once it has fully loaded. A failed cache-busted fetch never
      // wipes the last good frame, and the overlay only shows before the first
      // successful load.
      function refreshCamera(id) {
        const cam = camById(id);
        if (!cam || cam.type === 'stream') return;
        const refs = imgRefs[id] || [];
        if (!refs.length) return;

        const state = retryState[id] || (retryState[id] = { tries: 0, timer: null });
        const src = bust(cam.url);
        const loader = new Image();

        loader.onload = () => {
          state.tries = 0;
          deadIds.delete(id);
          lastGoodSrc[id] = src;
          refs.forEach(r => {
            r.el.src = src;
            if (r.onOk) r.onOk();
          });
          applyBadge(id);
          checkAge(id);
        };
        loader.onerror = () => {
          state.tries += 1;
          // Only surface the overlay if we have never shown a good frame yet.
          const neverLoaded = refs.every(r => !r.el.naturalWidth);
          if (neverLoaded && state.tries >= SHOW_AFTER) {
            refs.forEach(r => { if (r.onFail) r.onFail(); });
            refs.forEach(r => setBadge(r.badge, 'offline', 'Offline'));
            // Mark as offline so "Hide offline" catches feeds NPS lists as active
            // but that never load. Re-render the grid if it's now filtered out.
            if (!deadIds.has(id) && !lastGoodSrc[id]) {
              deadIds.add(id);
              if (hideOffline && activeId === null && !gridView.hidden) buildGrid();
            }
          }
          const delay = Math.min(700 * state.tries, 5000);
          if (state.timer) clearTimeout(state.timer);
          state.timer = setTimeout(() => refreshCamera(id), delay);
        };
        loader.src = src;
      }

      function refreshAll() {
        // Refresh every camera that currently has a visible <img> registered
        // (current park, favorites, sidebar, or search results). Streams have no
        // registered image, so they are naturally skipped. With the observer
        // active, offscreen tiles are skipped until they scroll into view.
        Object.keys(imgRefs).forEach(id => {
          const refs = imgRefs[id] || [];
          if (!imgObserver || refs.some(r => r.visible)) refreshCamera(id);
        });
      }


      // ---------- Build grid ----------
      const STAR = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
        '<path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.9l-5.81 3.06 1.11-6.47L2.6 9.9l6.5-.95L12 2.5z"/></svg>';

      function makeCard(cam, showPark) {
        const card = document.createElement('div');
        card.className = 'card';
        const isStream = cam.type === 'stream';
        const external = isStream && opensExternally(cam);
        const host = external ? streamHost(cam) : null;
        const subtitle = showPark
          ? parkNameOf(cam.id) + ' · ' + areaOf(cam.id)
          : (isStream ? (host ? 'opens on ' + host + ' ↗' : 'live stream') : '');
        const poster = isStream ? streamPoster(cam) : null;
        const media = isStream
          ? (poster ? '<img alt="' + cam.name + '" src="' + poster + '" />' : '<span class="noposter"></span>') +
            '<span class="playbtn"></span>' +
            (host ? '<span class="ext-tag">Opens on ' + host + ' ↗</span>' : '')
          : '<img alt="' + cam.name + '" /><div class="imgError" hidden>Unavailable</div>';
        const badgeHtml = isStream
          ? '<span class="badge stream"><span class="dot"></span> <span class="badge-label">Stream</span></span>'
          : '<span class="badge loading"><span class="dot"></span> <span class="badge-label">Loading</span></span>';
        card.innerHTML =
          '<div class="thumb">' + badgeHtml +
            '<button class="star' + (isFav(cam.id) ? ' on' : '') + '" title="Pin to favorites">' + STAR + '</button>' +
            media +
          '</div>' +
          '<div class="meta">' +
            '<span class="name">' + cam.name + '</span>' +
            '<span class="time">' + subtitle + '</span>' +
          '</div>';
        const star = card.querySelector('.star');
        if (!isStream) {
          const img = card.querySelector('img');
          const err = card.querySelector('.imgError');
          const badge = card.querySelector('.badge');
          // Only cards in the current-park view (no park subtitle) get a live
          // age readout; favorites/search cards keep their "Park · Area" label.
          const timeEl = showPark ? null : card.querySelector('.time');
          registerImg(cam.id, img, () => { err.hidden = true; }, () => { err.hidden = false; }, badge, timeEl);
        }
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFav(cam.id);
          buildGrid();
        });
        card.addEventListener('click', () => openDetail(cam.id));
        return card;
      }

      function gridSection(title, cams, showPark) {
        const section = document.createElement('div');
        section.className = 'area';
        const heading = document.createElement('h2');
        heading.className = 'area-title';
        heading.textContent = title;
        section.appendChild(heading);
        const row = document.createElement('div');
        row.className = 'area-grid';
        cams.forEach(cam => row.appendChild(makeCard(cam, showPark)));
        section.appendChild(row);
        return section;
      }

      function gridEmpty(msg) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = msg;
        grid.appendChild(d);
      }

      // ---------- Home / landing ----------
      // Ordered preview candidates for a park card. A camera flagged `hero: true`
      // wins (curated good view); otherwise active image cams, then any image,
      // then a stream poster. Each candidate is a { src, bust } we try in order,
      // falling back on load failure (fixes cards backed by a dead feed).
      function homePreviewSrcs(park) {
        const cams = park.areas.flatMap(a => a.cameras);
        const ordered = [
          ...cams.filter(c => c.hero),
          ...cams.filter(c => c.url && !c.off && !c.hero),
          ...cams.filter(c => c.url && c.off && !c.hero),
        ];
        const srcs = ordered.map(c => ({ src: c.url, bust: true }));
        // Stream posters as a last resort (static thumbnails, no bust needed).
        cams.filter(c => c.type === 'stream').forEach(c => {
          const p = streamPoster(c); if (p) srcs.push({ src: p, bust: false });
        });
        return srcs;
      }
      // Try each candidate source until one loads; leaves the dark placeholder
      // if all fail. Cross-origin black-but-valid frames can't be detected
      // (canvas reads are CORS-blocked), so only true load failures fall back.
      function loadParkPreview(imgEl, srcs, idx) {
        idx = idx || 0;
        if (idx >= srcs.length) { imgEl.style.display = 'none'; return; }
        const cand = srcs[idx];
        const url = cand.bust ? bust(cand.src) : cand.src;
        imgEl.onerror = () => loadParkPreview(imgEl, srcs, idx + 1);
        imgEl.onload = () => { if (imgEl.naturalWidth < 2) loadParkPreview(imgEl, srcs, idx + 1); };
        imgEl.src = url;
      }
      function makeParkCard(park, i) {
        const el = document.createElement('div');
        el.className = 'park-card';
        const count = park.areas.reduce((n, a) => n + a.cameras.length, 0);
        const srcs = homePreviewSrcs(park);
        el.innerHTML =
          (srcs.length ? '<img alt="" />' : '<span class="pc-noimg"></span>') +
          '<div class="pc-overlay"></div>' +
          '<div class="pc-info">' +
            '<div class="pc-name">' + park.park + '</div>' +
            '<div class="pc-count">' + count + ' camera' + (count === 1 ? '' : 's') + '</div>' +
          '</div>';
        if (srcs.length) loadParkPreview(el.querySelector('img'), srcs);
        el.addEventListener('click', () => showParkGrid(i));
        return el;
      }
      function buildHome() {
        statParks.textContent = PARKS.length;
        statCams.textContent = ALL_CAMERAS.length;
        buildMap();
        homeFavorites.innerHTML = '';
        const favs = favCameras();
        if (favs.length) homeFavorites.appendChild(gridSection('★ Favorites', favs, true));
        parkGrid.innerHTML = '';
        PARKS.map((p, i) => ({ p, i }))
          .sort((a, b) => a.p.park.localeCompare(b.p.park))
          .forEach(({ p, i }) => parkGrid.appendChild(makeParkCard(p, i)));
      }

      const MAP_VIEW_W = 960, MAP_VIEW_H = 560;

      const MAP_LON0 = -125, MAP_LATMAX = 49.5, MAP_OX = 8, MAP_OY = 12;
      const MAP_AK = { x0: 14, y0: 362, w: 172, h: 165, lon0: -170, lon1: -140, lat0: 54.5, lat1: 71.5 };

      function projMapMain(lon, lat) { return [MAP_OX + MAP_S * MAP_COSLAT0 * (lon - MAP_LON0), MAP_OY + MAP_S * (MAP_LATMAX - lat)]; }
      function projMapAK(lon, lat) { if (lon > 0) lon -= 360; return [MAP_AK.x0 + (lon - MAP_AK.lon0) / (MAP_AK.lon1 - MAP_AK.lon0) * MAP_AK.w, MAP_AK.y0 + (MAP_AK.lat1 - lat) / (MAP_AK.lat1 - MAP_AK.lat0) * MAP_AK.h]; }

      // Pick the projection for a park by region (Alaska / Hawaii / lower-48).

      let mapBuilt = false;
      function buildMap() {

      function buildGrid() {
        grid.innerHTML = '';
        // Search mode: match cameras across every park, grouped by park.
        if (searchText) {
          let total = 0;
          PARKS.forEach(p => {
            const cams = p.areas.flatMap(a => a.cameras).filter(passesFilters);
            if (cams.length) { total += cams.length; grid.appendChild(gridSection(p.park, cams, true)); }
          });
          if (!total) gridEmpty('No cameras match “' + searchText + '”.');
          return;
        }

        // Favorites section (filtered).
        const favs = favCameras().filter(passesFilters);
        if (favs.length) grid.appendChild(gridSection('★ Favorites', favs, true));

        // Current park, grouped by area (filtered).
        let shown = favs.length;
        AREAS.forEach(group => {
          const cams = group.cameras.filter(passesFilters);
          if (cams.length) { shown += cams.length; grid.appendChild(gridSection(group.area, cams, false)); }
        });
        if (!shown) gridEmpty('No cameras match the current filters.');
      }

      // ---------- Build detail sidebar ----------
      function makeSideCam(cam) {
        const el = document.createElement('div');
        el.className = 'side-cam' + (cam.id === activeId ? ' active' : '');
        const offNow = isOffline(cam);
        el.innerHTML =
          '<div class="stub"><img alt="' + cam.name + '" /><div class="imgError" hidden>Unavailable</div></div>' +
          '<div class="label"><span>' + cam.name + '</span>' +
          (isFav(cam.id) ? '<span class="mini-star">' + STAR + '</span>'
                         : '<span class="dot' + (offNow ? ' bad' : '') + '"></span>') +
          '</div>';
        const img = el.querySelector('img');
        const err = el.querySelector('.imgError');
        const dot = el.querySelector('.label .dot');
        if (cam.type === 'stream') {
          const p = streamPoster(cam);
          if (p) img.src = p;
        } else {
          registerImg(cam.id, img,
            () => { err.hidden = true; if (dot) dot.classList.remove('bad'); },
            () => { err.hidden = false; if (dot) dot.classList.add('bad'); });
        }
        el.addEventListener('click', () => openDetail(cam.id));
        return el;
      }

      function buildSidebar() {
        sideList.innerHTML = '';

        // A collapsible group: header (name + count + chevron) over a body of
        // cameras. Favorites' collapsed state persists; area groups default
        // expanded (in-session only) but always expand the active camera's group.
        function sideGroup(title, cams, opts) {
          opts = opts || {};
          const group = document.createElement('div');
          group.className = 'side-group';
          const head = document.createElement('button');
          head.className = 'side-group-head';
          head.innerHTML = '<span class="sg-chev"></span><span class="sg-name"></span>' +
            '<span class="sg-count">' + cams.length + '</span>';
          head.querySelector('.sg-name').textContent = title;
          const body = document.createElement('div');
          body.className = 'sg-body';
          cams.forEach(cam => body.appendChild(makeSideCam(cam)));
          group.appendChild(head);
          group.appendChild(body);

          const hasActive = cams.some(c => c.id === activeId);
          let collapsed = opts.persistKey ? favGroupCollapsed : false;
          if (hasActive) collapsed = false;   // never hide the camera being viewed
          group.classList.toggle('collapsed', collapsed);

          head.addEventListener('click', () => {
            const nowCollapsed = group.classList.toggle('collapsed');
            if (opts.persistKey) { favGroupCollapsed = nowCollapsed; saveFavGroupState(); }
          });
          return group;
        }

        // Hide offline cameras from the suggestions (keep the active one so the
        // detail you're viewing always appears in its group).
        const suggestable = (cam) => cam.id === activeId || !isOffline(cam);

        const favs = favCameras().filter(suggestable);
        if (favs.length) sideList.appendChild(sideGroup('★ Favorites', favs, { persistKey: 'fav' }));
        AREAS.forEach(group => {
          const cams = group.cameras.filter(suggestable);
          if (cams.length) sideList.appendChild(sideGroup(group.area, cams));
        });

        // Update the toggle count and collapse the whole panel by default on mobile.
        const n = sideList.querySelectorAll('.side-cam').length;
        sidebarLabel.textContent = 'Other cameras (' + n + ')';
        if (mobileMQ.matches) {
          sidebar.classList.add('collapsed');
          sidebarToggle.setAttribute('aria-expanded', 'false');
        } else {
          sidebar.classList.remove('collapsed');
          sidebarToggle.setAttribute('aria-expanded', 'true');
        }
      }

      // ---------- Navigation ----------
      function updateFavBtn() {
        const on = isFav(activeId);
        stageFav.textContent = on ? '★ Favorited' : '☆ Favorite';
        stageFav.classList.toggle('on', on);
      }

      function openDetail(id) {
        const cam = camById(id);
        // YouTube live embeds fail from file:// (Error 153 — null origin); open on
        // YouTube instead. Served over http(s) they embed inline in the stage.
        if (cam && cam.type === 'stream' && !canEmbedInline(cam)) {
          window.open(streamWatch(cam), '_blank', 'noopener'); return;
        }
        activeId = id;
        // If this camera lives in another park (e.g. opened from a global
        // favorite), switch the park context so the sidebar/refresh match.
        const pIdx = parkIndexOf(id);
        if (pIdx !== -1 && pIdx !== parkIndex) {
          parkIndex = pIdx;
          AREAS = PARKS[parkIndex].areas;
          parkSelect.value = String(parkIndex);
        }
        clearImgRefs();
        brandSub.textContent = PARKS[parkIndex].park;
        stageTitle.textContent = cam.name;
        stageArea.textContent = parkNameOf(id) + ' · ' + areaOf(id);
        updateWeather(id);
        updateFavBtn();
        const isStream = cam.type === 'stream';
        stageSave.hidden = isStream;
        stageRefresh.hidden = isStream;
        stageCount.hidden = isStream;
        stageWatch.hidden = !isStream;
        stageImgWrap.classList.toggle('zoomable', !isStream);
        stageUpdated.hidden = true;
        // Image cameras backed by a live feed get a link to the livestream page.
        stageLive.hidden = isStream || !cam.live;
        if (cam.live) stageLive.href = cam.live;
        // Link to the camera's official NPS page (for status/details) when known.
        // The camera name itself is the link, so no extra button clutters the bar.
        const npsPage = CAM_PAGES[id];
        if (npsPage) {
          stageTitle.href = npsPage;
          stageTitle.title = 'View this camera on nps.gov';
        } else {
          stageTitle.removeAttribute('href');
          stageTitle.removeAttribute('title');
        }
        if (isStream) {
          stageImage.hidden = true;
          const frame = replaceStageStream();
          frame.hidden = false;
          frame.src = streamEmbedSrc(cam);
          setBadge(stageBadge, 'stream', 'Stream');
          stageWatch.href = streamWatch(cam);
          stageWatch.textContent = streamHost(cam) ? 'Watch on ' + streamHost(cam) + ' ↗' : 'Open live ↗';
        } else {
          replaceStageStream();
          stageImage.hidden = false;
          stageError.hidden = true;
          registerImg(id, stageImage, () => { stageError.hidden = true; }, () => { stageError.hidden = false; }, stageBadge);
          updateUpdatedLabel(id);

        buildSidebar();
        setView('detail');

      // Download the exact frame currently on screen (not a fresh fetch), so the
      // image the user is looking at is what gets saved even if a newer frame
      // arrives moments later. Uses the already-loaded src.
      async function saveCurrent() {
        const cam = camById(activeId);
        if (!cam || cam.type === 'stream' || !stageImage.src) return;
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const fileName = cam.id + '_' + stamp + '.jpg';
        const url = stageImage.src;
        const saveLbl = stageSave.querySelector('.lbl');
        const original = saveLbl.textContent;
        saveLbl.textContent = 'Saving…';
        stageSave.disabled = true;
        try {
          const resp = await fetch(url, { cache: 'force-cache' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const blob = await resp.blob();

          // Preferred: native "Save As" dialog via File System Access API.
          if (window.showSaveFilePicker) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JPEG image', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }],
              });
              const writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              return;
            } catch (pickErr) {
              // User cancelled the dialog — abort without falling back.
              if (pickErr && pickErr.name === 'AbortError') return;
              // Otherwise (e.g. unsupported context) fall through to anchor download.
            }
          }

          // Fallback: anchor download (saves to default folder or asks,
          // depending on the browser's download settings).
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = objectUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
        } catch (e) {
          // Last resort: open in a new tab so the user can right-click → Save.
          window.open(url, '_blank', 'noopener');
        } finally {
          saveLbl.textContent = original;
          stageSave.disabled = false;
        }
      }

      stageSave.addEventListener('click', saveCurrent);

      // Share the current view. Prefers the native share sheet (mobile), then
      // clipboard copy, then a legacy textarea copy. The URL hash is deep-linkable.
      const shareLbl = stageShare.querySelector('.lbl');
      function flashShare(text) {
        const original = 'Share';
        shareLbl.textContent = text;
        stageShare.disabled = true;
        setTimeout(() => { shareLbl.textContent = original; stageShare.disabled = false; }, 1500);
      }
      async function shareCurrent() {
        const url = location.href;
        const cam = camById(activeId);
        const title = cam ? cam.name + ' — National Park Webcams' : 'National Park Webcams';
        // Native share sheet (mostly mobile). Bail quietly if the user cancels.
        if (navigator.share) {
          try { await navigator.share({ title, url }); return; }
          catch (e) { if (e && e.name === 'AbortError') return; /* else fall through */ }
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(url);
          } else {
            const ta = document.createElement('textarea');
            ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            if (!ok) throw new Error('execCommand failed');
          }
          flashShare('Copied!');
        } catch (e) {
          flashShare('Copy failed');
        }
      }

      stageShare.addEventListener('click', shareCurrent);

      // Fullscreen the whole stage (image + info/button bar) so users can still
      // see the camera name and save/share while fullscreen. The live image keeps
      // refreshing. Streams have their own player fullscreen, so image cams only.
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        if (!detailView || detailView.hidden) return;
        const cam = camById(activeId);
        if (!cam || cam.type === 'stream') return;
        if (stageEl.requestFullscreen) stageEl.requestFullscreen().catch(() => {});
      }
      stageFull.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
      stageImgWrap.addEventListener('click', (e) => {
        // Click the image (not the badge/overlay button) to toggle fullscreen.
        if (e.target === stageImage) toggleFullscreen();
      });
      document.addEventListener('fullscreenchange', () => {
        const on = document.fullscreenElement === stageEl;
        stageEl.classList.toggle('is-full', on);
        stageFull.title = on ? 'Exit fullscreen (f)' : 'Fullscreen (f)';
      });

      // ---------- Timer ----------
      function resetTimer() { remaining = intervalSeconds(); updateCount(); }
      function updateCount() { stageCount.textContent = 'next in ' + remaining + 's'; }

      function tick() {
        // Don't refresh while the tab is hidden — saves bandwidth/battery. We
        // resume (with an immediate refresh) on visibilitychange.
        if (document.hidden) return;
        remaining -= 1;
        if (remaining <= 0) {
          refreshAll();
          remaining = intervalSeconds();
        }
        updateCount();
      }

      // Resume promptly when the tab becomes visible again: refresh once so the
      // frames aren't stale, and restart the countdown.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { refreshAll(); resetTimer(); }
      });

      intervalInput.addEventListener('change', () => { resetTimer(); saveSession(); });

      // ---------- Park switching ----------
      function populateParks() {
        parkSelect.innerHTML = '';
        // Sort options alphabetically by park name, but keep each option's
        // value as its original index into PARKS.
        PARKS.map((p, i) => ({ name: p.park, i }))
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach(({ name, i }) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = name;
            parkSelect.appendChild(opt);
          });
        parkSelect.value = String(parkIndex);
        brandSub.textContent = PARKS[parkIndex].park;
      }

      parkSelect.addEventListener('change', () => {
        parkIndex = parseInt(parkSelect.value, 10) || 0;
        AREAS = PARKS[parkIndex].areas;
        brandSub.textContent = PARKS[parkIndex].park;
        if (searchText) { searchText = ''; searchInput.value = ''; }
        openGrid(); // return to grid for the newly selected park
      });

      // ---------- Search + filter controls ----------
      // Re-render the grid for a search/filter change (leaving detail if open).
      function applyGridChange() {
        if (activeId !== null) { openGrid(); return; }
        clearImgRefs();
        if (stageStream && stageStream.src) replaceStageStream();
        buildGrid();
        refreshAll();
        resetTimer();
      }
      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          const v = searchInput.value.trim().toLowerCase();
          if (v === searchText) return;
          searchText = v;
          // Typing on the home view drops into the (global) grid results.
          if (atHome) {
            if (!v) return;            // empty search on home: stay home
            atHome = false;
            setView('grid');
            backBtn.textContent = '← All parks';
            backBtn.style.display = 'inline-flex';
          }
          applyGridChange();
        }, 180);
      });
      chipOffline.addEventListener('click', () => { hideOffline = !hideOffline; chipOffline.classList.toggle('on', hideOffline); applyGridChange(); });
      chipStreams.addEventListener('click', () => { streamsOnly = !streamsOnly; chipStreams.classList.toggle('on', streamsOnly); applyGridChange(); });

      // ---------- Keyboard navigation ----------
      // Cameras in the current park that can be shown inline (skip streams that
      // would open an external tab, so arrow-stepping never launches new tabs).
      function navigableCameras() {
        return currentCameras().filter(c => !(c.type === 'stream' && !canEmbedInline(c)));
      }
      function stepDetail(dir) {
        const list = navigableCameras();
        if (!list.length) return;
        const i = list.findIndex(c => c.id === activeId);
        const next = list[(i + dir + list.length) % list.length];
        if (next) openDetail(next.id);
      }
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target;
        const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
        // "/" focuses search from anywhere except while typing.
        if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
        if (typing) { if (e.key === 'Escape') t.blur(); return; }
        if (e.key === 'Escape') {
          if (document.fullscreenElement) return;   // let the browser exit fullscreen
          if (activeId !== null) { e.preventDefault(); openGrid(); }
          else if (document.body.dataset.view === 'grid') { e.preventDefault(); openHome(); }
        } else if ((e.key === 'f' || e.key === 'F') && activeId !== null) {
          const cam = camById(activeId);
          if (cam && cam.type !== 'stream') { e.preventDefault(); toggleFullscreen(); }
        } else if (activeId !== null && (e.key === 'ArrowRight' || e.key === 'ArrowDown')) {
          e.preventDefault(); stepDetail(1);
        } else if (activeId !== null && (e.key === 'ArrowLeft' || e.key === 'ArrowUp')) {
          e.preventDefault(); stepDetail(-1);
        }
      });

      // ---------- Init ----------
      (function initState() {
        suppressHistory = true;
        const hash = location.hash.slice(1);
        let camId = null, pIdx = null, interval = null;
        if (hash && hash !== 'home') {
          const parts = hash.split('/');
          if (parts[1] && camById(parts[1])) camId = parts[1];
          else { const i = parkIndexBySlug(parts[0]); if (i !== -1) pIdx = i; }
        }
        try {
          const s = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
          if (s.interval) interval = s.interval;
        } catch (e) {}
        if (interval) intervalInput.value = interval;
        if (pIdx !== null) { parkIndex = pIdx; AREAS = PARKS[parkIndex].areas; }
        populateParks();
        if (camId) {
          const cam = camById(camId);
          if (cam && cam.type === 'stream' && !canEmbedInline(cam)) {
            const i = parkIndexOf(camId);
            if (i !== -1) { parkIndex = i; AREAS = PARKS[i].areas; parkSelect.value = String(i); }
            openGrid();
          } else {
            openDetail(camId);
          }
        } else if (pIdx !== null) {
          openGrid();
        } else {
          openHome();
        }
        suppressHistory = false;
        resetTimer();
      })();
      setInterval(tick, 1000);

      // Track the sticky top bar's height (it wraps to a variable number of rows
      // on mobile) so the fixed-height detail area fits exactly below it.
      (function trackTopbarHeight() {
        const root = document.documentElement;
        const topbar = document.querySelector('.topbar');
        const set = () => root.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
        set();
        if (window.ResizeObserver) new ResizeObserver(set).observe(topbar);
        window.addEventListener('resize', set);
      })();
    })();
  </script>
</body>
</html>
