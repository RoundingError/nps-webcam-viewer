<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mount Rainier Webcams</title>
  <style>
    :root {
      --bg: #0b0e13;
      --panel: #12161d;
      --panel-2: #171c25;
      --border: #232a35;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #4b98ff;
      --danger: #f85149;
      --live: #3fb950;
      --radius: 14px;
      --shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    /* ---------- Modern scrollbars ---------- */
    * {
      scrollbar-width: thin;
      scrollbar-color: #2d3542 transparent;
    }
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d3542;
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3d4757;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #141a24 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,14,19,.72);
    }
    .brand { display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
    .brand .eyebrow {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
    }
    .brand h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .topbar .spacer { flex: 1; }

    .backBtn {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .backBtn:hover { background: #1e2530; border-color: #313a48; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 999px;
    }
    .pill input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .pill select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      outline: none;
      cursor: pointer;
      font-weight: 600;
    }
    .pill select option { background: var(--panel-2); color: var(--text); }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 3px rgba(63,185,80,.15);
    }

    /* ---------- Views ---------- */
    .view { flex: 1; padding: 24px; }
    .view[hidden] { display: none; }

    /* ---------- Grid (preview) ---------- */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .area-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 650;
      margin: 0 2px 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .area-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #33507e;
      box-shadow: var(--shadow);
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .badge {
      position: absolute;
      top: 10px; left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      padding: 5px 9px;
      border-radius: 999px;
      color: #fff;
    }
    .badge .dot { width: 7px; height: 7px; }

    /* ---------- Favorite star (on thumbnails) ---------- */
    .star {
      position: absolute;
      top: 8px; right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
      color: rgba(255,255,255,.75);
      transition: background .15s, color .15s, transform .12s;
      padding: 0;
    }
    .star svg { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .star:hover { background: rgba(0,0,0,.7); transform: scale(1.08); }
    .star.on { color: #f5c518; }
    .star.on svg { fill: #f5c518; stroke: #f5c518; }

    .mini-star {
      display: inline-flex;
      color: #f5c518;
    }
    .mini-star svg { width: 13px; height: 13px; fill: #f5c518; stroke: #f5c518; }

    .favBtn.on {
      color: #f5c518;
      border-color: rgba(245,197,24,.5);
    }

    .card .meta {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card .meta .name { font-size: 14px; font-weight: 600; }
    .card .meta .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---------- Detail ---------- */
    .detail {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 20px;
      height: calc(100vh - 73px - 48px);
    }
    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stage-img {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .stage-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .stage-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    .stage-bar .title { font-size: 15px; font-weight: 650; }
    .stage-bar .area-tag {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .stage-bar .spacer { flex: 1; }
    .stage-bar .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .iconBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .iconBtn:hover { background: #1e2530; border-color: #313a48; }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 4px 2px;
      font-weight: 600;
    }
    .side-cam {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .side-cam:hover { transform: translateY(-2px); border-color: #33507e; }
    .side-cam.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .side-cam .stub {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .side-cam .stub img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .side-cam .label {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .side-cam .label .dot { width: 6px; height: 6px; }

    .imgError {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      font-size: 12px;
      background: repeating-linear-gradient(45deg, #14181f, #14181f 10px, #171c25 10px, #171c25 20px);
    }
    .imgError[hidden] { display: none; }

    @media (max-width: 820px) {
      .detail { grid-template-columns: 1fr; height: auto; }
      .sidebar { flex-direction: row; overflow-x: auto; }
      .sidebar h2 { display: none; }
      .side-cam { min-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button class="backBtn" id="backBtn">&larr; All cameras</button>
      <div class="brand">
        <span class="eyebrow">National Park Webcams</span>
        <h1 id="brandSub">Live views</h1>
      </div>
      <div class="spacer"></div>
      <span class="pill">
        Park
        <select id="parkSelect"></select>
      </span>
      <span class="pill">
        <span class="dot"></span>
        Refresh
        <select id="interval">
          <option value="1">1s</option>
          <option value="2">2s</option>
          <option value="5">5s</option>
          <option value="10">10s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
          <option value="40">40s</option>
          <option value="50">50s</option>
          <option value="60" selected>60s</option>
        </select>
      </span>
    </div>

    <!-- Grid preview -->
    <section class="view" id="gridView">
      <div class="grid" id="grid"></div>
    </section>

    <!-- Detail -->
    <section class="view" id="detailView" hidden>
      <div class="detail">
        <div class="stage">
          <div class="stage-img">
            <span class="badge"><span class="dot"></span> Live</span>
            <img id="stageImage" alt="" />
          </div>
          <div class="stage-bar">
            <span class="title" id="stageTitle"></span>
            <span class="area-tag" id="stageArea"></span>
            <button class="iconBtn favBtn" id="stageFav">☆ Favorite</button>
            <div class="spacer"></div>
            <span class="count" id="stageCount">next in 60s</span>
            <button class="iconBtn" id="stageRefresh">Refresh</button>
            <button class="iconBtn" id="stageSave">Save image</button>
          </div>
        </div>
        <div class="sidebar">
          <h2>Other cameras</h2>
          <div id="sideList"></div>
        </div>
      </div>
    </section>
  </div>

        {
          park: 'Yosemite',
          areas: [
            {
              area: 'Valley Views',
              cameras: [
                { id: 'yose-halfdome', name: 'Half Dome', url: 'https://pixelcaster.com/yosemite/webcams/ahwahnee2.jpg' },
                { id: 'yose-falls', name: 'Yosemite Falls', url: 'https://pixelcaster.com/yosemite/webcams/yosfalls.jpg' },
                { id: 'yose-sentinel', name: 'Sentinel Dome / El Capitan', url: 'https://pixelcaster.com/yosemite/webcams/sentinel.jpg' },
                { id: 'yose-turtleback', name: 'Turtleback Dome', url: 'https://pixelcaster.com/yosemite/webcams/turtleback.jpg' },
              ],
            },
            {
              area: 'Park Views',
              cameras: [
                { id: 'yose-badger', name: 'Badger Pass Ski Area', url: 'https://pixelcaster.com/aramark/yosemite-ski.jpg' },
                { id: 'yose-happyisles', name: 'Merced River at Happy Isles', url: 'https://usgs-nims-images.s3.amazonaws.com/overlay/CA_Merced_River_at_Happy_Isles_Bridge_Yosemite/CA_Merced_River_at_Happy_Isles_Bridge_Yosemite_newest.jpg' },
              ],
            },
          ],
        },
        {
          park: 'Acadia',
          areas: [
            {
              area: 'Park Views',
              cameras: [
                { id: 'acad-jordan', name: 'Jordan Pond', url: 'https://barharborcam.com/webcams/jordanpond/jordanpond.jpg' },
              ],
            },
          ],
        },
        {
          park: 'Zion',
          areas: [
            {
              area: 'Park Views',
              cameras: [
                { id: 'zion-temples', name: 'Temples and Towers of the Virgin', url: 'https://www.nps.gov/webcams-zion/camera2.jpg' },
              ],
            },
          ],
        },
      ];

      // Current park + derived views.
      let parkIndex = 0;
      let AREAS = PARKS[parkIndex].areas;

      // Global lookups span every park so favorites & IDs resolve anywhere.
      const ALL_CAMERAS = PARKS.flatMap(p => p.areas.flatMap(a => a.cameras));
      const CAMERAS = ALL_CAMERAS; // refreshAll iterates current-park cams (see below)
      function camById(id) { return ALL_CAMERAS.find(c => c.id === id); }
      function areaOf(id) {
        for (const p of PARKS) {
          const a = p.areas.find(a => a.cameras.some(c => c.id === id));
          if (a) return a.area;
        }
        return '';
      }
      function currentCameras() { return AREAS.flatMap(a => a.cameras); }
      function parkIndexOf(id) {
        return PARKS.findIndex(p => p.areas.some(a => a.cameras.some(c => c.id === id)));
      }
      function parkNameOf(id) { const i = parkIndexOf(id); return i === -1 ? '' : PARKS[i].park; }

      // ---------- Favorites (persisted in localStorage) ----------
      const FAV_KEY = 'nps-webcam-favorites';
      let favorites = [];
      try {
        const raw = localStorage.getItem(FAV_KEY);
        if (raw) favorites = JSON.parse(raw).filter(id => camById(id));
      } catch (e) { favorites = []; }

      function isFav(id) { return favorites.indexOf(id) !== -1; }
      function saveFavs() {
        try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (e) {}
      }
      function toggleFav(id) {
        const i = favorites.indexOf(id);
        if (i === -1) favorites.push(id); else favorites.splice(i, 1);
        saveFavs();
      }
      // Favorites are global across all parks.
      function favCameras() {
        return favorites.map(camById).filter(Boolean);
      }

      const grid = document.getElementById('grid');
      const gridView = document.getElementById('gridView');
      const detailView = document.getElementById('detailView');
      const backBtn = document.getElementById('backBtn');
      const intervalInput = document.getElementById('interval');
      const parkSelect = document.getElementById('parkSelect');
      const brandSub = document.getElementById('brandSub');

      const stageImage = document.getElementById('stageImage');
      const stageTitle = document.getElementById('stageTitle');
      const stageArea = document.getElementById('stageArea');
      const stageCount = document.getElementById('stageCount');
      const stageRefresh = document.getElementById('stageRefresh');
      const stageSave = document.getElementById('stageSave');
      const stageFav = document.getElementById('stageFav');
      const sideList = document.getElementById('sideList');

      let activeId = null;   // null = grid view
      let remaining = 0;

      function bust(url) { return url.split('?')[0] + '?' + Date.now(); }

      function intervalSeconds() {
        let s = parseInt(intervalInput.value, 10);
        if (isNaN(s) || s < 1) s = 1;
        return s;
      }

      // Track live <img> elements per camera plus their status callbacks so we
      // can swap in new frames and toggle the "Unavailable" overlay.
      const imgRefs = {};      // id -> [{ el, onOk, onFail }, ...]
      const retryState = {};   // id -> { tries, timer }
      const lastGoodSrc = {};  // id -> most recently loaded frame URL (for instant swaps)

      function registerImg(id, imgEl, onOk, onFail) {
        (imgRefs[id] = imgRefs[id] || []).push({ el: imgEl, onOk: onOk, onFail: onFail });
        // Show the cached frame immediately so swaps feel instant.
        if (lastGoodSrc[id]) {
          imgEl.src = lastGoodSrc[id];
          if (onOk) onOk();
        }
      }

      function clearImgRefs() {
        Object.keys(imgRefs).forEach(k => delete imgRefs[k]);
        Object.keys(retryState).forEach(k => {
          if (retryState[k].timer) clearTimeout(retryState[k].timer);
          delete retryState[k];
        });
      }

      const SHOW_AFTER = 3; // show overlay only after this many consecutive fails

      // Preload the next frame off-screen; only swap it into the visible <img>
      // elements once it has fully loaded. A failed cache-busted fetch never
      // wipes the last good frame, and the overlay only shows before the first
      // successful load.
      function refreshCamera(id) {
        const cam = camById(id);
        if (!cam) return;
        const refs = imgRefs[id] || [];
        if (!refs.length) return;

        const state = retryState[id] || (retryState[id] = { tries: 0, timer: null });
        const src = bust(cam.url);
        const loader = new Image();

        loader.onload = () => {
          state.tries = 0;
          lastGoodSrc[id] = src;
          refs.forEach(r => {
            r.el.src = src;
            if (r.onOk) r.onOk();
          });
        };
        loader.onerror = () => {
          state.tries += 1;
          // Only surface the overlay if we have never shown a good frame yet.
          const neverLoaded = refs.every(r => !r.el.naturalWidth);
          if (neverLoaded && state.tries >= SHOW_AFTER) {
            refs.forEach(r => { if (r.onFail) r.onFail(); });
          }
          const delay = Math.min(700 * state.tries, 5000);
          if (state.timer) clearTimeout(state.timer);
          state.timer = setTimeout(() => refreshCamera(id), delay);
        };
        loader.src = src;
      }

      function refreshAll() {
        // Current park cameras plus any global favorites (which may live in
        // other parks but are shown in the Favorites section).
        const ids = new Set(currentCameras().map(c => c.id));
        favorites.forEach(id => ids.add(id));
        ids.forEach(id => refreshCamera(id));
      }


      // ---------- Build grid ----------
      const STAR = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
        '<path d="M12 2.5l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.9l-5.81 3.06 1.11-6.47L2.6 9.9l6.5-.95L12 2.5z"/></svg>';

      function makeCard(cam, showPark) {
        const card = document.createElement('div');
        card.className = 'card';
        const subtitle = showPark
          ? parkNameOf(cam.id) + ' · ' + areaOf(cam.id)
          : 'live';
        card.innerHTML =
          '<div class="thumb">' +
            '<span class="badge"><span class="dot"></span> Live</span>' +
            '<button class="star' + (isFav(cam.id) ? ' on' : '') + '" title="Pin to favorites">' + STAR + '</button>' +
            '<img alt="' + cam.name + '" />' +
            '<div class="imgError" hidden>Unavailable</div>' +
          '</div>' +
          '<div class="meta">' +
            '<span class="name">' + cam.name + '</span>' +
            '<span class="time">' + subtitle + '</span>' +
          '</div>';
        const img = card.querySelector('img');
        const err = card.querySelector('.imgError');
        const star = card.querySelector('.star');
        registerImg(cam.id, img, () => { err.hidden = true; }, () => { err.hidden = false; });
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFav(cam.id);
          buildGrid();
        });
        card.addEventListener('click', () => openDetail(cam.id));
        return card;
      }

      function buildGrid() {
        grid.innerHTML = '';

        // Favorites section (only when there are any).
        const favs = favCameras();
        if (favs.length) {
          const section = document.createElement('div');
          section.className = 'area';
          const heading = document.createElement('h2');
          heading.className = 'area-title';
          heading.textContent = '★ Favorites';
          section.appendChild(heading);
          const row = document.createElement('div');
          row.className = 'area-grid';
          favs.forEach(cam => row.appendChild(makeCard(cam, true)));
          section.appendChild(row);
          grid.appendChild(section);
        }

        AREAS.forEach(group => {
          const section = document.createElement('div');
          section.className = 'area';
          const heading = document.createElement('h2');
          heading.className = 'area-title';
          heading.textContent = group.area;
          section.appendChild(heading);

          const row = document.createElement('div');
          row.className = 'area-grid';
          group.cameras.forEach(cam => row.appendChild(makeCard(cam)));

          section.appendChild(row);
          grid.appendChild(section);
        });
      }

      // ---------- Build detail sidebar ----------
      function makeSideCam(cam) {
        const el = document.createElement('div');
        el.className = 'side-cam' + (cam.id === activeId ? ' active' : '');
        el.innerHTML =
          '<div class="stub"><img alt="' + cam.name + '" /></div>' +
          '<div class="label"><span>' + cam.name + '</span>' +
          (isFav(cam.id) ? '<span class="mini-star">' + STAR + '</span>' : '<span class="dot"></span>') +
          '</div>';
        const img = el.querySelector('img');
        registerImg(cam.id, img);
        el.addEventListener('click', () => openDetail(cam.id));
        return el;
      }

      function buildSidebar() {
        sideList.innerHTML = '';

        const favs = favCameras();
        if (favs.length) {
          const heading = document.createElement('h2');
          heading.textContent = '★ Favorites';
          sideList.appendChild(heading);
          favs.forEach(cam => sideList.appendChild(makeSideCam(cam)));
        }

        AREAS.forEach(group => {
          const heading = document.createElement('h2');
          heading.textContent = group.area;
          sideList.appendChild(heading);
          group.cameras.forEach(cam => sideList.appendChild(makeSideCam(cam)));
        });
      }

      // ---------- Navigation ----------
      function updateFavBtn() {
        const on = isFav(activeId);
        stageFav.textContent = on ? '★ Favorited' : '☆ Favorite';
        stageFav.classList.toggle('on', on);
      }

      function openDetail(id) {
        activeId = id;
        const cam = camById(id);
        // If this camera lives in another park (e.g. opened from a global
        // favorite), switch the park context so the sidebar/refresh match.
        const pIdx = parkIndexOf(id);
        if (pIdx !== -1 && pIdx !== parkIndex) {
          parkIndex = pIdx;
          AREAS = PARKS[parkIndex].areas;
          parkSelect.value = String(parkIndex);
          brandSub.textContent = PARKS[parkIndex].park;
        }
        clearImgRefs();
        stageTitle.textContent = cam.name;
        stageArea.textContent = parkNameOf(id) + ' · ' + areaOf(id);
        updateFavBtn();
        registerImg(id, stageImage);
        buildSidebar();
        gridView.hidden = true;
        detailView.hidden = false;
        backBtn.style.display = 'inline-flex';
        refreshAll();
        resetTimer();
        window.scrollTo(0, 0);
      }

      function openGrid() {
        activeId = null;
        clearImgRefs();
        buildGrid();
        detailView.hidden = true;
        gridView.hidden = false;
        backBtn.style.display = 'none';
        refreshAll();
        resetTimer();
      }

      backBtn.addEventListener('click', openGrid);
      stageRefresh.addEventListener('click', () => { refreshAll(); resetTimer(); });
      stageFav.addEventListener('click', () => {
        toggleFav(activeId);
        updateFavBtn();
        buildSidebar();
      });

      // Download the exact frame currently on screen (not a fresh fetch), so the
      // image the user is looking at is what gets saved even if a newer frame
      // arrives moments later. Uses the already-loaded src.
      async function saveCurrent() {
        const cam = camById(activeId);
        if (!cam || !stageImage.src) return;
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const fileName = cam.id + '_' + stamp + '.jpg';
        const url = stageImage.src;
        const original = stageSave.textContent;
        stageSave.textContent = 'Saving…';
        stageSave.disabled = true;
        try {
          const resp = await fetch(url, { cache: 'force-cache' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const blob = await resp.blob();

          // Preferred: native "Save As" dialog via File System Access API.
          if (window.showSaveFilePicker) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JPEG image', accept: { 'image/jpeg': ['.jpg', '.jpeg'] } }],
              });
              const writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              return;
            } catch (pickErr) {
              // User cancelled the dialog — abort without falling back.
              if (pickErr && pickErr.name === 'AbortError') return;
              // Otherwise (e.g. unsupported context) fall through to anchor download.
            }
          }

          // Fallback: anchor download (saves to default folder or asks,
          // depending on the browser's download settings).
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = objectUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
        } catch (e) {
          // Last resort: open in a new tab so the user can right-click → Save.
          window.open(url, '_blank', 'noopener');
        } finally {
          stageSave.textContent = original;
          stageSave.disabled = false;
        }
      }

      stageSave.addEventListener('click', saveCurrent);

      // ---------- Timer ----------
      function resetTimer() { remaining = intervalSeconds(); updateCount(); }
      function updateCount() { stageCount.textContent = 'next in ' + remaining + 's'; }

      function tick() {
        remaining -= 1;
        if (remaining <= 0) {
          refreshAll();
          remaining = intervalSeconds();
        }
        updateCount();
      }

      intervalInput.addEventListener('change', resetTimer);

      // ---------- Park switching ----------
      function populateParks() {
        parkSelect.innerHTML = '';
        // Sort options alphabetically by park name, but keep each option's
        // value as its original index into PARKS.
        PARKS.map((p, i) => ({ name: p.park, i }))
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach(({ name, i }) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = name;
            parkSelect.appendChild(opt);
          });
        parkSelect.value = String(parkIndex);
        brandSub.textContent = PARKS[parkIndex].park;
      }

      parkSelect.addEventListener('change', () => {
        parkIndex = parseInt(parkSelect.value, 10) || 0;
        AREAS = PARKS[parkIndex].areas;
        brandSub.textContent = PARKS[parkIndex].park;
        openGrid(); // return to grid for the newly selected park
      });

      // ---------- Init ----------
      populateParks();
      buildGrid();
      refreshAll();
      resetTimer();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
